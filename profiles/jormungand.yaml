# スマスロ ヨルムンガンド 機種プロファイル
#
# 【機種概要】
#   メーカー: 山佐ネクスト / 導入日: 2026年4月6日 / タイプ: AT機(スマスロ)
#   通常天井: AT間999G+α(到達でAT当選確定)
#   仮天井 : 450G+α。設定変更時(リセット)、または上位AT「恥の世紀」の開始時
#            失敗後に発動し、450G+αに到達すれば必ずAT当選する
#            (通常天井999Gより約549G手前で当選確定という強いリセット恩恵)
#   機械割 : 設定1=97.8% / 設定3=100.9%(損益分岐) / 設定6=113.9%
#   恥の世紀 開始時成功率: 設定1=16.0% / 設定6=57.4%(特大設定差。失敗すれば
#            仮天井450G+αへ短縮されるため、低設定ほど「短縮天井台」が量産される)
#   仮天井選択率(リセット/失敗後に450Gルートが選ばれる確率): 設定1=33.6% /
#            設定6=50.0%
# 出典: https://slobase.jp/machines/jormungand (機種詳細・総合ページ、
#       最終更新2026-08-17時点のものを2026年9月14日にcurl取得)
#       https://slobase.jp/articles/jormungand-expected-value (天井期待値・
#       狙い目G数・時給シミュ完全データ、最終更新2026-09-01)
#       https://slobase.jp/articles/jormungand-reset (朝イチ・リセット狙い
#       完全解説、最終更新2026-09-01)
# WebFetchのAI要約は信用せず、curl -A "Mozilla/5.0 ..." で生HTMLを取得し、
# Read toolで実際の<table>セル値・本文のG数/円表記を直接目視確認した上で
# 転記している(攻略サイト側の算出値であり、公式一次情報ではない)。
# nana-press.com(https://nana-press.com/kaiseki/machine/1101/35969/)も取得を
# 試みたが、円換算の期待値テーブルは掲載されておらず(天井G数・恩恵の解説記事
# のみ)、本プロファイルの期待値データの出典には採用していない。
#
# 【重要: 出典サイト内で発見した期待値の数値不一致について】
# slobase.jpは同じ「ヨルムンガンド」を扱う複数ページ・複数コンポーネントで、
# 実は2系統の異なる期待値数値セットを掲載している(捏造ではなく、サイト側の
# データ不整合と考えられる。2026年9月14日、生HTMLを直接確認して発見した):
#
#   系統A(粗いテーブル・300G刻み以降/簡易ウィジェット):
#     ev.html「G数別期待値テーブル(50G刻み)」本文表:
#       通常時 等価 300G:-300円 / 400G:+300円 / 450G:+650円 / 500G:+1,000円 /
#       550G:+1,500円 / 600G:+2,000円 / 650G:+2,750円 / 700G:+3,500円 /
#       800G:+5,500円 / 900G:+8,000円
#       通常時 5.6枚 300G:-600円 / 400G:-100円 / 450G:+200円 / 500G:+500円 /
#       550G:+1,000円 / 600G:+1,300円 / 650G:+1,900円 / 700G:+2,500円 /
#       800G:+4,100円 / 900G:+6,300円
#       仮天井時(単一列、等価/5.6の区別なし) 300G:+1,500円 / 400G:+3,000円
#     reset.html「仮天井時G数別アクション」表(main.htmlにも同一内容が埋め込み):
#       0G:-500円 / 100G:+98円 / 200G:+500円 / 300G:+1,500円 / 400G:+3,000円
#
#   系統B(main.html本体の詳細50G刻みテーブル):
#     「天井期待値一覧(等価)」0〜950G・50G刻み(tables.normal.等価として転記)
#     「仮天井時(450G)」0〜400G・50G刻み(tables.quasi.等価として転記)
#
# 系統AとBは同じ「通常時等価」「仮天井時等価」のはずなのに、例えば通常時550G
# (系統A:+1,500円 / 系統B:+1,256円)、仮天井時200G(系統A:+500円 / 系統B:
# +1,445円)のように大きく食い違う。さらにreset.htmlは同一ページ内でも
# 「仮天井時G数別アクション」表(系統A: 0G:-500円)と、よくある質問の回答文
# (系統B: 「0G(-918円)...200Gで+1,445円、400Gで+5,599円」)が矛盾しており、
# サイト側のコンポーネント間でデータが同期されていないと判断した。
#
# 本プロファイルは系統Bを採用した。理由:
#   1. 系統Bの数値は、サイト自身が本文で明言する損益分岐ゲーム数と高精度で
#      一致する: 通常時「損益分岐は約366G」(系統Bの350G:-88円→400G:+181円を
#      線形補間するとゼロ交点は約366.4G)、仮天井時「損益分岐が約91Gまで
#      下がる」(系統Bの50G:-445円→100G:+98円を線形補間するとゼロ交点は
#      約91.0G)。系統Aから同様に計算した交点(通常時350G/仮天井時約83.6G)は
#      サイトの記述する数値と一致しない。
#   2. 系統Bはサイトの主要記事(ev.html)のFAQ回答文からも本文数値として
#      引用されている(「550Gで+1,256円、700Gで+2,897円」等)。
#   3. 系統Bは50G刻みで0Gから連続しており、300G未満のデータが存在しない
#      系統Aより本アプリのテーブル参照(cycle完全一致+G数線形補間)に適している。
# 系統Aは今回不採用としたが、数値自体を削除するのではなく本コメントに記録し、
# 光さんの実戦ログが貯まった際にどちらの系統が実態に近いか検証できるようにした。
#
# 【5.6枚交換レートのテーブルを収録していない理由(重要)】
# プロジェクトの通常方針(CLAUDE.md)では交換レート軸のデフォルトを「5.6枚現金」
# にするが、本機種は上記の理由で採用した系統B(main.htmlの詳細テーブル)が
# 「等価」のみの掲載で、5.6枚換算の数値を一切公表していない。仮天井テーブルに
# 至っては、不採用とした系統Aも含めどのページを見ても等価専用の単一列であり、
# 5.6枚換算の数値はサイト上のどこにも存在しない(通常時のみ系統Aに5.6枚列が
# あったが、系統Aの等価列を不採用とした以上、対になる5.6枚列だけを系統Bの
# 等価テーブルに接ぎ木すると実態のない数値を作ることになるため、これも不採用と
# した)。「無理に埋めない」という方針(数値が出典に見当たらない場合は推測で
# 埋めない)に従い、本プロファイルのexchange_rate軸は「等価」の1区分のみとし、
# デフォルトも「等価」にしている(他機種プロファイルとは異なる、意図的な逸脱)。
# サイト本文には「5.6枚交換は等価より20%以上下振れする」「通常時は+100G、
# 仮天井圏は+50G、狙い目を後ろ倒しして考える」という定性的な目安の記載があり、
# これはev_policy_note/notesに参考情報として転記したが、この比率を機械的に
# 掛けて5.6枚テーブルを自動生成することはしていない。5.6枚交換で運用する
# 光さんは、本ツールの「等価」表示を参考にしつつ、この目安分を自分で割り引いて
# 判断すること。将来、5.6枚換算の一次データが見つかった場合、または実戦ログが
# 貯まった場合に追加を検討する。
#
# 【仮天井到達=当選確定ルールについて】
# kabaneri_kaimon_kessen.yamlのcycle_ceiling_reached_ruleパターンを踏襲し、
# 「仮天井(450G+α、quasi_ceiling_active時)または通常天井(999G+α)に到達すれば
# AT当選が確定する」という、円換算期待値とは独立した確定事実を無条件の続行
# 推奨ルールとして最優先評価する。これにより、仮天井テーブルのデータが400Gまで
# しかなくても(400G〜450Gの間はデータ欠落でev_missingにより様子見表示になるが)、
# 450Gちょうど以降は確定当選の事実に基づいて自動的に続行推奨へ切り替わる。
# 同様に通常時テーブルも950Gまでしかないが、999G到達で無条件に続行推奨になる。

id: jormungand
name: "スマスロ ヨルムンガンド"
summary: "通常天井(AT間999G+α)と仮天井(450G+α、設定変更後/恥の世紀失敗後)の2段階天井。仮天井発動時は損益分岐が約91Gまで大幅に早まる強いリセット恩恵が特徴。"
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/jormungand.jpg")
ev_policy_note: >
  通常天井(999G+α)または仮天井(450G+α、設定変更後・恥の世紀失敗後)到達、
  あるいは自然当選まで打ち続けることを前提にした期待値です(出典サイトは
  本テーブル自体の算出条件を明記していませんが、G数が天井に近づくほど期待値が
  上昇する連続テーブルであることから、天井到達または自然当選までの継続を前提に
  算出されたものと考えられます)。出典サイトの運営者コメントには「設定1を
  引いた場合、表の数字より下振れ気味」という言及があり、本テーブル自体が
  具体的にどの設定を想定しているかは本文に明記されていません。光さんの
  「平日は基本的に低設定運用」という前提に対し、本テーブルの数値はやや
  楽観的である可能性がある点に留意してください。
  また本テーブルは「等価」交換のみのデータです。5.6枚交換の場合、出典サイトは
  「等価より20%以上下振れする。通常時は+100G、仮天井圏は+50G、狙い目を
  後ろ倒しして考えるのが安全」という目安を示しています(円換算の5.6枚専用
  テーブルは出典に存在しないため、本ツールには収録していません)。
  なおAT終了後は、全役対象に1/2048で当選する引き戻し抽選圏(50G+α)があるため、
  この区間を消化してからヤメるべきとされています(この判定はv1の範囲外です。
  本ツールが扱うのは「天井までの続行/見送り」判定のみです)。

axes:
  - key: current_game_count
    label: "現在の消化ゲーム数(通常天井AT間999G+α/仮天井450G+α、共通のデータカウンター表示)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。ホール備え付けのデータカウンター表示から直接観測する値。

  - key: quasi_ceiling_active
    label: "仮天井が発動中か(設定変更(リセット)濃厚、または上位AT「恥の世紀」開始時に失敗した後)"
    type: boolean
    default: false
    # 期待値テーブルのどちらの表(通常天井999G+α用/仮天井450G+α用)を参照するかを
    # 決める。仮天井は2つの独立した発動条件(設定変更/恥の世紀失敗)を持つが、
    # どちらも同じ450G+αへの短縮という同一の恩恵になるため、1つのboolean軸に
    # まとめている(kabaneri_kaimon_kessen.yamlのshort_ceiling_activeと同じ手法)。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価"]
    default: "等価"
    # 【他機種プロファイルとの意図的な違い】通常はデフォルトを「5.6枚現金」に
    # するが、本機種は採用した出典テーブル(系統B、詳細はファイル冒頭コメント
    # 参照)が「等価」のみの掲載で、信頼できる5.6枚換算の一次数値が存在しない
    # ため、無理に数値を作らず「等価」の1区分のみとしている。

derived:
  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数(toaru_index2.yaml/sao2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

  # 現在有効な天井ゲーム数(仮天井発動中なら450G+α、そうでなければ通常999G+α)。
  - key: active_ceiling
    expr: "450 if quasi_ceiling_active else 999"

  # 天井到達は円換算EVとは独立した確定事実(AT当選確定)。ev_yenがまだ
  # マイナス圏、またはテーブルのデータ範囲外でも、この到達判定だけは
  # 別枠で評価する(kabaneri_kaimon_kessen.yamlのcycle_ceiling_reachedと同じ考え方)。
  - key: ceiling_reached
    expr: "current_game_count >= active_ceiling"

# 期待値テーブル参照の設定。quasi_ceiling_activeでquasi/normalのどちらの表を
# 見るかを決め、dummy_cycle(常に1で完全一致)とcurrent_game_count(前後の行を
# 線形補間)で該当する期待値(円)を引く。結果はev_yenという名前でrulesから
# 参照できるようになる。
ev_lookups:
  - table_select_axis: quasi_ceiling_active
    table_select_true: quasi
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(等価交換想定)"
    table_true_label: "仮天井(設定変更後・恥の世紀失敗後、450G+α)"
    table_false_label: "通常天井(据え置き、999G+α)"

rules:
  # 天井到達(仮天井450G+α/通常天井999G+α)はAT当選確定の事実のため最優先で
  # 判定する。ev_yenがテーブル範囲外・マイナス圏でも続行推奨にする。
  - id: ceiling_reached_rule
    condition: "ceiling_reached"
    result: "続行推奨"
    reason: "天井(仮天井450G+α/通常天井999G+α)に到達しています。AT当選が確定するゲーム数のため続行が有力です(円換算の期待値とは別枠の確定事実による判定です)。"

  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常時950G超/仮天井時400G超)、または未入力です。天井が近い場合は入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(等価交換想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(等価交換想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(等価交換想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年4月6日導入の山佐ネクスト製AT機。通常天井(AT間999G+α)とは別に、
  設定変更時(リセット)または上位AT「恥の世紀」の開始時失敗後に発動する
  仮天井(450G+α、到達で必ずAT当選)を持つ。仮天井選択率には設定差があり
  (設定1=33.6%/設定6=50.0%)、恥の世紀の開始時成功率にも特大の設定差がある
  (設定1=16.0%/設定6=57.4%、裏を返せば設定1は84.0%が失敗して仮天井へ短縮)。

  機械割: 設定1=97.8% / 設定2=98.8% / 設定3=100.9%(損益分岐) / 設定4=104.7% /
  設定5=109.6% / 設定6=113.9%。通常AT「ヨルムンガンドラッシュ」純増約2.4枚/G、
  上位AT「パーフェクトオーダー」純増約5.0枚/G。

  【リセット恩恵の強さ(系統Bのテーブルから導かれる数値)】
  通常時(据え置き想定)は損益分岐が約366G(等価)で、550G時点で+1,256円。
  仮天井発動時(設定変更後/恥の世紀失敗後)は損益分岐が約91Gまで大幅に早まり、
  200G時点で+1,445円、400G時点で+5,599円に達する。同じ「損益分岐からの
  経過G」で比べても仮天井発動時の方が短時間で高い期待値に到達しており、
  「仮天井が発動している台を確保できるかどうか」が収支に直結する機種である
  ことが数値からも裏付けられる。天井ゲーム数自体で比較すると、仮天井は
  通常天井より549G(999G-450G)手前でAT当選が確定する。

  期待値テーブルの出典・不採用とした系統Aとの数値不一致・5.6枚テーブルを
  収録していない理由については、いずれもこのファイル冒頭のコメントに詳細を
  記録した。本プロファイルはまだ検証が薄い(サイト内に矛盾する数値セットが
  複数存在する状態で作成した)ため、実戦ログが十分に貯まった段階で、光さん
  自身のデータと突き合わせて閾値やテーブル自体を再検証・補正することを
  強く推奨する。

  なお出典サイト(slobase.jp)は「設定判別ツール」も提供しているが、本プロジェクト
  の方針(CLAUDE.md「設定判別機能は不要」)に従い、本プロファイルには設定判別
  ロジックを一切実装していない。

