# スマスロ ワールドダイスター 機種プロファイル
#
# 【機種情報】
# 大都技研製、2026年8月3日導入のスマスロ。原作は2023年放送のTVアニメ「ワールド
# ダイスター」(スロベースの記載による)。
# 出典: https://slobase.jp/machines/world-dai-star
#       https://slot-toolbox.com/world-dai-star-tenjo/
#
# 【天井システム】
# ゲーム数天井のみのシンプルな1系統構成(モンキーターンVのような周期概念はない)。
#   - 通常状態: 999G+αでボーナス当選
#   - 短縮天井(600G+α): 以下いずれかの状態でボーナス当選
#       ・設定変更後
#       ・上位ST(ワールドダイスターショウタイム)終了後
#       ・ラッキーモード4種のうち「ノスタルジアモード」滞在時
#         (他の3ラッキーモード滞在中は天井短縮の対象外。この情報はslobase.jpの
#          FAQ本文で確認したもの)
#   上位ST終了後は「追加公演チャンス(100G)+CZ消化」を経てもなお600G+α短縮が
#   継続する。攻略サイト側もCZ失敗後の約100G地点を「短縮天井テーブルの100G地点」
#   と同一の期待値として扱っているため、本プロファイルでも短縮天井発生要因を
#   1つのboolean軸(short_ceiling_active)にまとめ、同じ期待値テーブル(short)を
#   共通で参照する設計にした。
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slot-toolbox.com「スロット ワールドダイスター 天井期待値・
# 狙い目・やめどきまとめ」に掲載されている期待値表を転記したもの。WebFetchの
# AI要約はページを取得するたびに数値が変動する不安定な挙動を示したため、要約を
# 信用せずcurlで生HTMLを取得し、Read toolで実際のテーブル行(<td>タグの中身)を
# 直接目視確認した上で転記している(攻略サイト側の算出値であり、公式一次情報では
# ない)。前提条件は以下の通り(ページ内の記載による):
#   - 設定1ベース。ボーナス初当り1/306.5、出玉率97.8%、通常時ベース約30G/50枚、
#     AT純増約8.0枚/Gを基準にした算出値
#   - 通常状態は999G+α天井を含む平均的な当選をもとに算出。100G・300G・600Gの
#     前兆による個別振り分けは反映されていない(未公表のため)
#   - 短縮天井(600G+α)は設定変更後を基準に算出。朝イチの100G当選率優遇や
#     ラッキーモード・キャラポイント初期値優遇などの上振れ要素はこの期待値には
#     単純合算されていない可能性がある
# 出典: https://slot-toolbox.com/world-dai-star-tenjo/ (2026年9月11日取得)
#
# 【データ確度に関する注記(重要)】
# 別の解析サイトslobase.jp(https://slobase.jp/machines/world-dai-star)にも
# 50G刻みの独自期待値表があり、同じくcurl+Read toolで生HTMLを直接確認した。
# ただしslobase.jp側は同じゲーム数でも本プロファイルの採用元(slot-toolbox.com)
# より明確に低い(保守的な)期待値を算出している(例: 通常状態300G地点で
# slot-toolbox=+248円に対しslobase=-182円、500G地点でslot-toolbox=+1,292円に
# 対しslobase=+863円)。両サイトとも「単調増加」「大まかな損益分岐ゲーム数の
# 桁」は一致しており、どちらかが明らかな捏造・矛盾というわけではなく、攻略
# サイト間でよくある前提条件(ボーナス/CZ振り分けの仮定、時給換算の取り方等)の
# 差と考えられる。本プロファイルはslot-toolbox.comの表を採用したが、slobase.jp
# の方が保守的な数値であるため、実戦ログが貯まるまでは「本テーブルの期待値は
# やや楽観寄りの可能性がある」という前提で使うこと。

id: world_dystar
name: "スマスロ ワールドダイスター"
summary: "999G+αのゲーム数天井のみのシンプル構成。設定変更後・上位ST後・ノスタルジアモード滞在時は600G+αに短縮。"
ev_policy_note: >
  天井(通常999G+α/短縮600G+α)到達または自然当選まで打ち続けることを前提に
  した期待値です。出典サイトのヤメどき解説では、通常ST終了後はおみくじ・
  キャラポイント・ラッキーモード示唆・努力の破片を確認し、明確な続行材料が
  なければ即ヤメが基本とされています(この「即ヤメ」は表の前提と同じ位置づけ
  です)。一方、上位ST終了後は追加公演チャンス・CZを消化し、CZ失敗後も
  600G+α短縮天井を基準に次回ボーナスまで続行するのが基本とされており、
  short_ceiling_active(短縮天井)を選んだ場合はこちらの「続行が基本」という
  前提で読んでください。示唆演出による上振れは金額には反映されていません。
header_image: "assets/world_dystar.jpg"

axes:
  - key: game_count
    label: "現在の消化ゲーム数(通常時999G+α/短縮天井600G+α共通のカウンター表示)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。画面表示から直接観測する値。

  - key: short_ceiling_active
    label: "天井が600G+αに短縮されている状態か(設定変更後・上位ST後・ノスタルジアモード滞在時のいずれか)"
    type: boolean
    default: false
    # 期待値テーブルのどちらの表(通常999G+α用/短縮600G+α用)を参照するかを決める。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。
    # 期待値テーブル(tables)のどのレート区分を参照するかを選ぶ。

derived:
  # この機種にcycleの概念はない(ゲーム数天井のみの1系統構成)。tables側の各行は
  # cycle列を全行1で埋めており、そこと一致させるための定数。これによりengineの
  # 2次元(cycle×game_count)ルックアップ機構をそのまま1次元テーブルとして流用
  # できる(toaru_index2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

# 期待値テーブル参照の設定。short_ceiling_activeでnormal/shortのどちらの表を見るか、
# exchange_rateでどのレート区分を見るかを決め、dummy_cycle(常に1で完全一致)と
# game_count(前後の行を線形補間)で該当する期待値(円)を引く。結果はev_yenという
# 名前でderived/rulesから参照できるようになる。
ev_lookups:
  - table_select_axis: short_ceiling_active
    table_select_true: short
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: game_count
    result_key: ev_yen
    label: "期待値(設定1想定)"
    table_true_label: "短縮天井(設定変更後・上位ST後・ノスタルジアモード時)"
    table_false_label: "通常天井"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1(最低設定)を仮定した攻略サイト(slot-toolbox.com、2026年8月
  導入直後の解析情報)の算出値であり、実際の設定・実戦データによる補正ではない。
  同種の解析サイトslobase.jpはより保守的な(低めの)期待値を算出しており、本
  テーブルはやや楽観寄りの可能性がある。設定変更後・上位ST後・ノスタルジア
  モード滞在時の3状態を「短縮天井(600G+α)」として1つのboolean軸にまとめて
  いるが、朝イチ優遇(100G当選率上乗せ等)やラッキーモード別の上振れは期待値
  テーブルに単純反映されていない可能性がある。導入から日が浅く実戦データの
  蓄積も薄いため、実戦ログが十分に貯まった段階で、光さん自身のデータと突き
  合わせて閾値やテーブル自体を補正すること。

