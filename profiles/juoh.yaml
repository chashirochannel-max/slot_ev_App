# スマスロ 獣王 機種プロファイル
#
# 【機種情報】
# 2026年10月5日導入のスマスロATタイプ(AT=サバンナチャンス「SC」)。出典ページの
# 基本スペック表にメーカー名の記載が無かったため、本プロファイルでもメーカーは記載
# しない(推測で書かない)。
# SC初当り1/326.5(設定1)〜1/279.7(設定6)、出玉率97.8%〜114.3%、ベース約31.8G/50枚、
# 純増約8.0枚/G、サバ連突入時の平均獲得約886枚、初回SC→サバ連期待度約50%。
# SC初当り確率はSC終了後の29G間を分母から除いた数値(出典注記)。
#
# 【天井システム】
#   - 通常時: 最大999GでSC/BIG/REGのいずれかに当選(救済機能)。
#   - 設定変更後: 最大599Gへ短縮。最初のサバ連までこの短縮は継続する(SC単発で
#     終わった場合は次回も599G)。設定変更と無関係なSC単発だけでは短縮されない。
#   - SC終了後は最大29Gの潜伏区間があり、29G以内に次のSCならサバ連。
#   - 天井専用のSCストック保証・サバ連保証は現時点で確認できず(出典)。
# 出典の期待値表は「通常状態(サバ連なし時)」と「設定変更後・599G短縮」の2本で、
# 両者は単純なオフセット関係ではない(短縮側は平均獲得を-50枚低く見ているため)。
# そのためnormal/resetの2テーブルを別々にそのまま転記している。
#
# 【この期待値データについて(重要)】
# slot-toolbox.com「スマスロ 獣王 天井期待値・狙い目・やめどき」の「💰 天井期待値・
# 狙い目ライン」の表を転記したもの。WebFetchのAI要約は使わず、curl -s -A "Mozilla/5.0"
# で取得した生HTML/タグ除去テキストから目視+Pythonで行単位に抽出して転記。
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\juoh.html / juoh.txt
# 出典: https://slot-toolbox.com/juoh-tenjo/ (2026年10月29日取得)
#
# 【設定変更後テーブルの「平均獲得差」について(重要)】
# 出典の短縮テーブルは、ページ上で「短縮状態の平均獲得差」を 差なし/-25/-50/-60/-75/
# -100枚 から切り替えられる仕様(HTML内のJavaScriptに6パターンの表が埋め込まれている)。
# 出典は「設定変更時はAT当選後の平均獲得が通常時より低くなる傾向も確認されている
# ため、現時点では-50枚差を基準にしています」として-50枚(当サイト基準・初期表示)を
# 採用しており、本プロファイルもこの-50枚(平均獲得 約531枚→約481枚)の表を転記した。
# 参考: 差なし(0枚)だと0Gで等価+279円、-100枚だと0Gで等価-1,314円まで変わる。
#
# 【期待値表の前提条件(出典ページ本文より要約)】
#   - 設定1の公表初当り・通常時約31.8G/50枚・通常999G・短縮599Gが基礎データ。
#   - 公表初当りにはサバ連後100Gの優遇区間も含まれるため、サバ連なし時の通常期待値
#     ではその影響を切り分けている(公表値をそのまま使うより少し厳しめ)。
#   - 通常状態は期待値計算上の平均獲得基準約531枚、短縮状態は-50枚の約481枚。
#   - 天井当選時の回収条件は通常・短縮で共通。
#   - 100G・300G付近のSC高確による上乗せは別加算していない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 通常(サバ連なし・999G): 等価 300G(-282円)→400G(+279円)/5.6枚持ち 300G(-252円)→400G(+249円)/
#                          5.6枚現金 500G(-28円)→600G(+928円)
# 設定変更後(599G・-50枚): 等価 0G(-517円)→100G(+278円)/5.6枚持ち 0G(-462円)→100G(+248円)/
#                          5.6枚現金 100G(-684円)→200G(+345円)
# 出典の「狙い目」(時給1,000円基準): 通常 等価440G/持ち450G/現金560G前後〜、
# 設定変更後 等価130G/持ち140G/現金220G前後〜。
#
# 【データ範囲・扱わなかったもの】
#   - 通常テーブルは30G〜950G。出典は「SC終了後0～29Gは潜伏確認区間のため、通常状態の
#     期待値表は29G抜け後の30Gから掲載」としている。engineの仕様上、30G未満の入力は
#     先頭行(30G)の値にクランプされる(0〜29Gは表の対象外である点をnotesに明記)。
#     950G超はNone(様子見)。
#   - 短縮テーブルは0G〜550G(250G以降は50G刻み)。550G超はNone(様子見)。
#   - 「通常状態(サバ連あり時)」は出典に期待値表が無く「サバ連後30G～100G+α」の
#     狙い目ゾーンのみ記載されているため、テーブル化していない(ev_policy_noteに記載)。
#   - 転記した全テーブルが単調増加であることを確認済み(非単調注記なし)。

id: juoh
name: "スマスロ 獣王"
summary: "最大999G(設定変更後は最初のサバ連まで599G)のゲーム数天井。SC後29Gの潜伏確認とサバ連後100Gゾーンが立ち回りの要。期待値表はサバ連なし時の通常状態と設定変更後の2本。"
ev_policy_note: >
  通常テーブルは「サバ連なし時」の通常状態が対象です。SC終了後は最大29Gの潜伏を
  確認し、29G抜けで高確・前兆がなければヤメる前提です(出典のやめどき)。サバ連
  終了後100G付近まではSP高確移行に期待できる別枠の狙い目ゾーンで、この表より
  期待値が高い(数値表は出典に無いため本ツールでは計算していません)。設定変更後
  テーブルはAT平均獲得を通常時より50枚低く見た出典の基準値で、サバ連済みなら
  599G短縮は終了しているので通常テーブルを使ってください。100G・300G付近の
  SC高確による上乗せは金額に反映されていません。
header_image: "assets/badges_mascot/juoh.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のゲーム数(前回SC終了から。0〜29Gは潜伏確認区間で表の対象外)"
    type: integer
    default: 0

  - key: reset_likely
    label: "設定変更後でまだサバ連していないか(天井が999G→599Gに短縮)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # cycleの概念はない。tables側の各行はcycle列を全行1で埋めており、そこと一致
  # させるための定数(bakemonogatari.yaml・world_dystar.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・ゲーム数天井基準)"
    table_true_label: "設定変更後・サバ連前(599G天井)"
    table_false_label: "通常・サバ連なし(999G天井)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常950G超/設定変更後550G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1を仮定した攻略サイト(slot-toolbox.com)の算出値であり、実際の
  設定・実戦データによる補正ではない。設定変更後テーブルは出典が切り替え式で掲載
  している6パターン(平均獲得差 0/-25/-50/-60/-75/-100枚)のうち、出典の基準値である
  -50枚の表を採用した。解析で状態別の平均獲得が判明すると出典側で差し替えられる
  可能性がある。

  通常テーブルは30G〜950G、設定変更後テーブルは0G〜550Gまで。通常状態で0〜29Gを
  入力するとengineの仕様で30Gの値(クランプ)が表示されるが、この区間はSC潜伏確認
  中であり、表の前提外である。

  サバ連後100Gゾーン(狙い目:サバ連後30G～100G+α)は期待値表が無いため計算して
  いない。出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深いため、本
  プロファイルのrules(EV=0±200円)は出典の狙い目より早く「様子見」「続行推奨」に
  転じる。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

