# L魔法少女にあこがれて(まほあこ) 機種プロファイル
#
# 【機種情報】
# ニューギン製、2026年10月19日導入の疑似ボーナス+AT機(スマスロ)。
# AT初当り1/436.3(設定1)〜1/305.7(設定6)、CZ初当り1/357.0〜1/235.4、
# 出玉率97.6%〜112.0%、通常時約31.4G/50枚、AT純増約2.5枚/G(上位ATは約5.0枚/G)、
# ボーナス合算1/249.6(全設定共通)。
#
# 【天井システム(周期・モード区切りなし、AT間ゲーム数天井のみ)】
# bakemonogatari.yamlと同型の「単一ゲーム数カウンター+設定変更後に天井短縮」パターン。
#   - 通常時: AT間999G+αでAT「まほあこラッシュ」当選(あこがれアタック経由)。
#   - 設定変更後: AT間799G+αに短縮(200G短縮)。
#   - 疑似ボーナスのみではAT間天井はリセットされない(ボーナス間G数ではなくAT間G数で数える)。
# 出典サイトの期待値表は「設定変更後0G＝通常時200Gとして、同じ行で期待値を確認
# できます。※天井短縮200Gだけを反映した対応です。」と明記した上で、通常時G数と
# 設定変更後G数を1つの表に並記する形式。本プロファイルではこの1本の表をnormal/reset
# の2テーブルに分割して転記しただけであり、独自の補間・推測は行っていない。
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slot-toolbox.com「L魔法少女にあこがれて 天井期待値・狙い目・
# やめどき」の「💰 天井期待値・狙い目ライン」の表を転記したもの。WebFetchのAI要約は
# 使わず、curl -s -A "Mozilla/5.0" で生HTMLを取得し、タグを除去したテキストを目視+
# Pythonで行単位に抽出して転記している。
# 抽出に使った生HTML・テキスト:
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\mahoako.html / mahoako.txt
# 出典: https://slot-toolbox.com/mahoako-tenjo/ (2026年10月29日取得)
#
# 【期待値表の前提条件(出典ページ本文より要約)】
#   - 設定1のAT初当り約1/436.3、通常時約31.4G/50枚、疑似ボーナスの平均的な獲得が基準。
#   - AT当選時の平均獲得を約510枚と見込んだ試算(メーカー公表値ではない)。
#   - 通常999G+α/設定変更後799G+α。両状態の差は天井200G短縮分のみを反映。
#   - AT終了後は引き戻し・本前兆・続行必須の示唆を確認してヤメる想定。
#   - 設定変更後の百合メーター初回優遇(MAX時CZ当選率 通常20.7%→設定変更後初回34.0%)、
#     個別のゾーン・モード示唆、閉店取り切れずは金額へ加算していない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 通常時(999G天井): 等価 200G(-29円)→300G(+553円)/5.6枚持ち 200G(-26円)→300G(+493円)/
#                    5.6枚現金 400G(-73円)→500G(+813円)
# 設定変更後(799G天井): 等価 0G(-29円)→100G(+553円)/5.6枚現金 200G(-73円)→300G(+813円)
# 出典の「狙い目」(通常 等価330G/持ち350G/現金490G前後〜、設定変更後 等価130G/持ち150G/
# 現金290G前後〜)は「時給1,000円以上となる最初のゲーム数」という出典独自の基準。
#
# 【データ範囲】
# 通常テーブルは0〜900G、resetテーブルは0〜700G(100G刻み)。天井直前の950G等は出典に
# 無いため、900G(リセット後700G)を超える入力はengine仕様によりNone(様子見)となる。
#
# 【モード・周期概念について】
# 奇数百G付近のCZ・AT抽選、偶数百G付近のポイント高確移行抽選はあるが、期待値表は
# 単一のAT間G数カウンターに対するブレンド値で、転記した全テーブルが単調増加である
# ことを確認済み。ev_policy_noteに「非単調」注記は付けていない。

id: mahoako
name: "L魔法少女にあこがれて"
summary: "AT間天井(通常999G+α/設定変更後799G+α)のみの単一カウンター制。疑似ボーナスではAT間G数がリセットされない点に注意。設定変更後は通常時+200G相当の期待値からスタート。"
ev_policy_note: >
  AT終了後は引き戻し・本前兆・続行必須の示唆を確認してヤメる前提の期待値です
  (出典サイトの算出条件)。AT当選時の平均獲得は約510枚と見込んだ出典独自の試算で、
  メーカー公表値ではありません。設定変更後・AT後初回の百合メーターMAX時CZ優遇
  (34.0%)、奇数百GのCZ・AT抽選直前の価値、強い示唆、閉店による欠損は金額に
  反映されていません。疑似ボーナスを挟んだ台はデータカウンターではなく前回AT
  終了からのG数を入力してください。
header_image: "assets/badges_mascot/mahoako.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のAT間ゲーム数(前回AT終了から。疑似ボーナスを挟んでもリセットしない。設定変更後は799G天井としてそのままのカウントを入力)"
    type: integer
    default: 0

  - key: reset_likely
    label: "設定変更(0G状態)が確認できるか(天井が999G→799Gに短縮される)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # cycleの概念はない。tables側の各行はcycle列を全行1で埋めており、そこと一致
  # させるための定数(bakemonogatari.yaml・world_dystar.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・AT間天井基準)"
    table_true_label: "設定変更後(799G天井)"
    table_false_label: "通常時(999G天井)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常900G超/設定変更後700G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1を仮定した攻略サイト(slot-toolbox.com)の算出値であり、実際の
  設定・実戦データによる補正ではない。2026年10月19日導入直後(取得時点で導入10日)の
  初期データで、AT平均獲得約510枚も出典独自の見込み値のため、解析が進むと数値が
  変わる可能性が高い。resetテーブルは出典が「設定変更後0G＝通常時200G」と明記して
  いる対応関係どおり、通常テーブルの200G〜900G行をそのまま0G〜700Gとして転記した
  もので、補間・推測による値ではない。

  通常テーブルは0〜900G、resetテーブルは0〜700Gまでのデータしかない。それを超える
  入力はデータ範囲外(様子見)扱いになる。

  出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深い。本プロファイルの
  rulesはEV=0基準(±200円バッファ)で判定するため、出典の狙い目より早く「様子見」
  「続行推奨」に転じる。数値の誤りではなく判定基準の違い。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

