# スマスロ ソードアート・オンラインⅡ(SAO2) 機種プロファイル
#
# 【機種特定について】
# 「ソードアート・オンラインⅡ」という名称のスロットは以下の2機種が存在する:
#   - 初代「スロット ソードアート・オンライン(スマスロSAO)」: 2023年5月15日導入・大都技研
#   - 「スマスロ ソードアート・オンラインⅡ(SAO2)」        : 2026年6月8日導入・パオン・ディーピー/大都技研
# 「Ⅱ」表記かつより新しく現行稼働している可能性が高いことから、後者(SAO2)を
# 対象として本プロファイルを作成した。
# 出典: https://p-town.dmm.com/machines/5025 、
#       https://chonborista.com/slot/daito-slot/256112/
#
# 【天井システムについて】
# 実ゲーム数・液晶ゲーム数の異なるカウンターが複数系統存在する、とある魔術の禁書
# 目録2(toaru_index2.yaml)に近い設計の機種。
#   1. AT間天井(実ゲーム数・最大1200G+α): 到達でAT確定。今回EVテーブルの出典が
#      見つかったのはこの系統のみ。
#   2. CZ間天井(実ゲーム数・最大499G+α): 到達でCZ当選。設定変更後や初回上位CZ
#      失敗後は256G+αに短縮される。
#   3. CZ間天井(液晶ゲーム数・内部モード依存): 通常A/B時800G、通常C時650G、
#      通常D時350G、天国時100Gで、いずれもCZ当選。
# 2・3系統については、天井ゲーム数の仕組みは複数の解析サイトで一致して確認できた
# ものの、円換算の期待値テーブル(ゲーム数×期待値)を出典として提示しているサイトは
# 見つからなかった。数値を捏造しないという方針のため、この2系統は判定(EV計算)には
# 使わず、参考表示専用の入力項目としてのみ実装した(cz_real_game_count /
# cz_lcd_game_count)。
# 出典: https://chonborista.com/slot/daito-slot/256112/ 、
#       https://kozelog.net/machine/daitogiken/sao2/
#
# 【期待値データについて(重要)】
# 判定は「AT間天井(実ゲーム数)の開始ゲーム数」を軸にした期待値(円)テーブルを
# 参照して行う。このテーブルはnana-press.com「SAO2（スマスロ）天井の期待値や
# 恩恵・ヤメ時と狙い目まとめ」に掲載されている「ゲーム数天井期待値【暫定版】」表
# (0〜1150G・50G刻み、等価交換/5.6枚交換の2系列)を転記したもの。
#   - 設定1(最低設定)ベース。光さんの「平日は基本的に低設定運用のホールを想定」
#     という前提に合わせている
#   - コイン持ち約31G/50枚、非前兆中・CZ天井考慮なし、AT終了後即ヤメという
#     出典側の前提に基づく算出値
#   - 「5.6枚交換」列は持ちメダル/現金の区別が出典に明記されていなかったため、
#     enumの選択肢も2種類(等価/5.6枚)のみとした(他プロファイルのような
#     5.6枚持ちメダル/5.6枚現金の3区分にはしていない)
# 出典: https://nana-press.com/kaiseki/machine/1158/37243/
#
# 【データの信頼性検証について】
# WebFetchの要約が実在しない表を作文するリスクがあるため、以下の方法で裏取りを
# 行った:
#   1. nana-press.comのページを2回(概要取得→全行取得)フェッチし、内容が
#      一致することを確認
#   2. 独立した別サイト(kozelog.net)から代表値(650G/750G/800G/1000Gの
#      等価・5.6枚換算値)を取得し、nana-press.comの表と完全一致することを確認
#   3. ゲーム数が増えるほど期待値が単調増加しているか(内部整合性)を
#      Pythonスクリプトでアサーション済み
# なお検索過程で見つけたrakupachi.comの記事タイトルには「1000Gで+7,100円」という
# 上記(6,026円)と食い違う数値が見えたが、アクセス制限(HTTP 429)によりページ
# 本文を検証できなかったため採用しなかった。実戦ログが貯まったら、光さん自身の
# データと突き合わせて検証・補正すること。

id: sao2
name: "スマスロ ソードアート・オンラインⅡ(SAO2)"
summary: "AT間天井(実ゲーム数1200G+α)が主軸。CZ間天井(499G+α/短縮256G+α)は参考表示のみで判定には未反映。"
ev_policy_note: >
  AT間天井(実ゲーム数)到達または自然当選まで打ち続けることを前提にした
  期待値です。表自体の算出条件は「AT終了後即ヤメ」ですが、出典サイトの
  別項目(ヤメどき解説)では「AT終了後50G間は毎ゲーム引き戻し抽選が行われる
  ため、50G消化後のヤメを推奨」とも明記されており、この表よりも50Gだけ
  長く粘った方が実際には有利な可能性があります(サイト内でも算出条件と
  実戦アドバイスが完全には一致していない点として認識しておくこと)。
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/sao2.jpg")

axes:
  - key: current_real_game_count
    label: "現在の実ゲーム数(AT間天井カウンター・最大1200G+α)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。ホール備え付けの台上カウンター表示から直接観測する値。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚"]
    default: "等価"
    # 期待値テーブル(tables)のどのレート区分を参照するかを選ぶ。出典側で
    # 持ちメダル/現金の区別が明記されていなかったため、5.6枚は1区分のみ。

  - key: cz_real_game_count
    label: "現在のCZ間実ゲーム数(参考表示のみ・最大499G+α、設定変更後や上位CZ失敗後は256G+αに短縮)"
    type: integer
    optional: true
    # 判定(期待値テーブル参照)には使わない。この系統の円換算期待値データが
    # 見つからなかったための参考表示専用の入力。

  - key: cz_lcd_game_count
    label: "現在の液晶ゲーム数(参考表示のみ・内部モード依存で100G〜800G+αが天井)"
    type: integer
    optional: true
    # 判定には使わない。モード別(通常A/B:800G、通常C:650G、通常D:350G、
    # 天国:100G)の円換算期待値データが見つからなかったための参考表示専用の入力。

ev_lookups:
  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数(toaru_index2.yamlと同じ手法)。table_select_axis
  # もAT間天井の単一テーブル群しか使わないため、常にtrueを返す定数を割り当てる。
  - table_select_axis: always_main
    table_select_true: at_ceiling
    table_select_false: at_ceiling
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_real_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・AT間天井/実ゲーム数基準)"

derived:
  - key: always_main
    expr: "True"
  - key: dummy_cycle
    expr: "1"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力された実ゲーム数が期待値データの範囲外(1150G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "AT間天井(実ゲーム数)基準の期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "AT間天井(実ゲーム数)基準の期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "AT間天井(実ゲーム数)基準の期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年6月8日導入のスマスロ「ソードアート・オンラインⅡ(SAO2)」(パオン・
  ディーピー/大都技研)を対象とした。旧作「スマスロSAO」(2023年5月導入・
  大都技研)とは別機種。

  期待値はAT間天井(実ゲーム数・最大1200G+α)のみを対象とし、設定1(最低設定)を
  仮定した攻略サイト(nana-press.com)の算出値をkozelog.netの独立データと
  突き合わせて一致を確認した上で採用している。出典:
  https://nana-press.com/kaiseki/machine/1158/37243/ 、
  https://kozelog.net/machine/daitogiken/sao2/

  CZ間天井(実ゲーム数・最大499G+α系統/液晶ゲーム数・モード依存100〜800G+α系統)
  については、天井到達ゲーム数の仕組みは複数サイトで確認できたが、円換算の
  期待値テーブルの出典が見つからなかったため、期待値データ未確認として判定には
  使わず、参考表示専用の入力項目(cz_real_game_count/cz_lcd_game_count)としてのみ
  実装している。実戦ログや追加の解析データが揃ったら、この2系統のev_lookupsを
  追加し、toaru_index2.yamlと同様にmax()で最も高い期待値を採用する方式へ
  拡張することを検討すること。

  また5.6枚交換の期待値列は、出典側で持ちメダル/現金の区別が明記されていな
  かったため、他機種プロファイル(monkey_turn_v等)のような3区分(等価/5.6枚
  持ちメダル/5.6枚現金)ではなく、2区分(等価/5.6枚)のみで実装している。

