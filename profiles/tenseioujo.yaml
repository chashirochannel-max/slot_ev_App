# L転生王女と天才令嬢の魔法革命 機種プロファイル
#
# 【機種情報】
# 製造元/総販売元 オリンピアエステート/HEIWA、2026年10月5日導入の疑似ボーナス+
# ボーナス高確機(スマスロ)。
# 転天BONUS初当り1/320.0(設定1)〜1/246.4(設定6)、CZ初当り1/171.5〜1/136.0、
# 出玉率97.9%〜110.3%、通常時50枚あたり約32.4G(設定1)、ボーナス中純増約4.5枚/G。
# 初回ボーナス(約100枚)後、ボーナス高確「王宮舞踏会」(初回40G+α)で連チャンを目指す。
#
# 【天井システム】
#   - ボーナス間天井: 通常時510G+αで転天BONUS(CZ消化G数は含まない)。
#   - 設定変更後: ボーナス間410G+α、CZ間最大310G+α(モードB以上濃厚)、ポイント0〜9pt内部加算。
#   - CZ間天井: モードA410G/B310G/C210G/D110G+α。CZ失敗ごとにモード昇格。
#   - 王宮舞踏会駆け抜け後: 次回CZモードC以上濃厚(CZ間最大210G+α)。
# 出典の期待値表は「通常状態」「設定変更後(初当り前)」「王宮舞踏会駆け抜け後」の
# 3本で、いずれも横軸はCZ消化中を除いた「ボーナス間通常G数」。3本は互いに単純な
# オフセット関係ではないため、それぞれ別テーブルとしてそのまま転記した。
#
# 【3状態の実装方法(engineの変更なしで3表を切り替えるための工夫)】
# engineのev_lookupは1系統につきboolean 1本で2テーブルしか選べない。そこで:
#   - 入力軸 ceiling_state(enum 3択)から derived で is_reset / is_kakenuke を作る。
#   - ev_lookups[0](通常/設定変更後)は is_reset で normal/reset を選ぶ。
#   - ev_lookups[1](駆け抜け後)は kakenuke テーブル固定。
#   - それぞれのゲーム数軸を derived の main_game / kakenuke_game とし、選択中でない
#     系統側はNoneにしてその系統の期待値を「ー」表示にする(誤って足し合わせたり
#     別状態の値を見ないようにするため。出典も「表同士の金額は足し合わせないで
#     ください」と明記)。
#   - rulesは「is_kakenukeならev_kakenuke、そうでなければev_main」を条件式内の
#     三項演算で選んで判定する。
#
# 【この期待値データについて(重要)】
# slot-toolbox.com「スマスロ 転生王女と天才令嬢の魔法革命 天井期待値・狙い目・
# やめどき」の「💰 天井期待値・狙い目ライン」の3表を転記したもの。WebFetchのAI要約は
# 使わず、curl -s -A "Mozilla/5.0" で取得した生HTML/タグ除去テキストを目視+Pythonで
# 行単位に抽出して転記。
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\tenseioujo.html / tenseioujo.txt
# 出典: https://slot-toolbox.com/tenseioujo-tenjo/ (2026年10月29日取得)
#
# 【期待値表の前提条件(出典ページ本文より要約)】
#   - 設定1の初当り・通常時の回転数・CZモードの昇格と、ボーナス・高確の平均的な獲得を考慮。
#   - 各表は次の初当りボーナスを経て、一連のボーナス高確・上位区間が最初に終了する
#     までの収支。駆け抜け後に改めて続行する投資・回収は含まない(続行する場合は
#     駆け抜け後の表で判断し、表同士の金額は足し合わせない)。
#   - 設定変更後はボーナス間410G短縮・モードB以上・ポイント加算、駆け抜け後はモードC
#     以上を考慮。強いモード示唆やポイントMAX直前などの追加利益は加算していない。
#   - 5.6枚交換の現金投資は50枚/1,000円貸しの条件。
#   - 同じボーナス間G数でもCZ間G数・失敗回数・ポイント残量で条件が変わる。表はそれらが
#     平均的な状態を含む目安で、CZ間G数だけを当てはめる表ではない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 通常(510G):       等価 0G(-1,341円)→100G(+439円)/5.6枚持ち 0G(-1,197円)→100G(+392円)/
#                   5.6枚現金 100G(-530円)→200G(+1,332円)
# 設定変更後(410G): 等価・持ちは0Gからプラス(+733円/+655円)、5.6枚現金 0G(-234円)→100G(+1,882円)
# 駆け抜け後:       0Gから全レートでプラス(等価+1,414円/持ち+1,263円/現金+449円)
# 出典の「狙い目」(時給1,000円基準): 通常 等価120G/持ち130G/現金170G前後〜、設定変更後
# 等価10G/持ち10G/現金50G前後〜、駆け抜け後 等価0G/持ち0G/現金20G前後〜。
#
# 【データ範囲】
# 通常0〜500G、設定変更後0〜400G、駆け抜け後0〜400G(いずれも100G刻み)。それを超える
# 入力はengine仕様によりNone(様子見)。
# 3表とも単調増加(駆け抜け後表は200G→300Gの伸びが+311円と小さいが減少はしない)
# であることを確認済み。表をまたぐ非単調性は3状態を別テーブルにしたことで再現される。

id: tenseioujo
name: "L転生王女と天才令嬢の魔法革命"
summary: "ボーナス間510G+α天井(設定変更後410G+α)とCZ間天井(モードA〜D)の2系統。期待値表は通常/設定変更後/王宮舞踏会駆け抜け後の3状態で、駆け抜け後と設定変更後は浅いG数からプラス。"
ev_policy_note: >
  各表は「次の初当りボーナスから一連のボーナス高確・上位区間が最初に終了するまで」
  打つ前提の期待値です。追加ボーナスを引いた連チャン終了後は基本ヤメ。王宮舞踏会を
  駆け抜けた場合は、状態を「駆け抜け後」に切り替えて改めて判断してください(表同士
  の金額は足し合わせない)。CZ失敗後はボーナス間G数を引き継いだまま、昇格後のCZ
  上限・ポイント残量も含めて再判断します。強いモード示唆・ポイントMAX直前などの
  上振れは金額に反映されていません。入力するG数はCZ消化中を除いたボーナス間通常
  G数です(データカウンターの数字と異なる場合あり)。
header_image: "assets/badges_mascot/tenseioujo.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のボーナス間通常ゲーム数(CZ消化中のG数は含めない。CZ失敗後も0に戻さない)"
    type: integer
    default: 0

  - key: ceiling_state
    label: "台の状態"
    type: enum
    options:
      - "通常状態"
      - "設定変更後(初当り前)"
      - "王宮舞踏会駆け抜け後"
    default: "通常状態"
    # 出典の3つの期待値表のどれを参照するかを決める。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  - key: is_reset
    expr: "ceiling_state == '設定変更後(初当り前)'"
  - key: is_kakenuke
    expr: "ceiling_state == '王宮舞踏会駆け抜け後'"
  # 選択中でない系統のゲーム数をNoneにして、その系統の期待値を「ー」表示にする。
  - key: main_game
    expr: "None if is_kakenuke else current_game_count"
  - key: kakenuke_game
    expr: "current_game_count if is_kakenuke else None"
  - key: always_main
    expr: "True"
  # cycleの概念はない。tables側の各行はcycle列を全行1で埋めている。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: is_reset
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: main_game
    result_key: ev_main
    label: "期待値(設定1想定・通常/設定変更後)"
    table_true_label: "設定変更後(410G天井)"
    table_false_label: "通常状態(510G天井)"

  - table_select_axis: always_main
    table_select_true: kakenuke
    table_select_false: kakenuke
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: kakenuke_game
    result_key: ev_kakenuke
    label: "期待値(設定1想定・王宮舞踏会駆け抜け後のみ)"

rules:
  - id: ev_missing
    condition: "(ev_kakenuke if is_kakenuke else ev_main) == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常500G超/設定変更後・駆け抜け後400G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "(ev_kakenuke if is_kakenuke else ev_main) > 200"
    result: "続行推奨"
    reason: "選択した状態の期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "(ev_kakenuke if is_kakenuke else ev_main) >= -200"
    result: "様子見"
    reason: "選択した状態の期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "選択した状態の期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1を仮定した攻略サイト(slot-toolbox.com)の算出値であり、実際の
  設定・実戦データによる補正ではない。3表(通常/設定変更後/駆け抜け後)は出典が
  別々に算出・掲載しているものをそのまま転記しており、補間・推測による値ではない。

  結果画面には2系統の期待値欄が並ぶが、選択中の状態に対応する欄だけに数値が出て、
  もう一方は「ー」(未入力扱い)になる。判定に使われるのは数値が出ている側のみ。
  機種選択カードの損益分岐表示には3状態すべての目安が並ぶ。

  CZ間天井(モードA〜D、110〜410G+α)・CZ失敗回数・転天ポイント残量は円換算の期待値
  表が無いため軸にしていない。出典も「CZ間G数だけを当てはめる表ではない」と注記
  している。

  出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深いため、本プロファイルの
  rules(EV=0±200円)は出典の狙い目より早く「様子見」「続行推奨」に転じる。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

