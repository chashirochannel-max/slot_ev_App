# スマスロ モンスターハンターライズ:サンブレイク 機種プロファイル
#
# 【機種情報】
# アデリオン製、2026年10月5日導入のゲーム数管理型AT機(AT「サンブレイクラッシュ」)。
# AT初当り1/349.9(設定1)〜1/242.3(設定6)、出玉率97.5%〜112.4%、通常時ベース約31.9G/50枚、
# 通常AT純増約2.7枚/G(高純増区間約6.6枚/G)、平均獲得504枚。
#
# 【天井システム】
#   - AT間天井: 999G+αでAT当選。
#   - CZ間天井: 333G+αでCZ当選。
#   - CZスルー天井: 6回連続失敗後は次回CZ成功濃厚。
#   - 周期天井: リプレイ20回で1周期、最大5周期でCZ当選。
#   - 設定変更後: AT間999G+αのまま(短縮なし)。天井G数リセット+規定リプレイ回数の
#     加算・初回AT恩恵あり(ただし期待値表には加算されていない)。
# 期待値表(円換算)が出典にあるのはAT間999Gの1本のみ。設定変更で天井が短縮されない
# ため、sao2.yamlと同じく単一テーブル(at_ceiling)+always_main定数の構成とし、
# reset_likely軸は設けていない。
#
# 【この期待値データについて(重要)】
# slot-toolbox.com「スマスロ モンスターハンターライズ：サンブレイク 天井期待値・
# 狙い目・やめどき」の「通常AT間999G｜天井期待値」表を転記したもの。WebFetchのAI要約
# は使わず、curl -s -A "Mozilla/5.0" で取得した生HTML/タグ除去テキストを目視+Python
# で行単位に抽出して転記。
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\mhrsb.html / mhrsb.txt
# 出典: https://slot-toolbox.com/mhrsb-tenjo/ (2026年10月29日取得)
#
# 【期待値表の前提条件(出典ページ本文より要約)】
#   - 設定1のAT初当り・通常時約31.9G/50枚・AT間999G+αが基準。AT当選時は平均獲得504枚。
#   - CZ間333G、CZスルー、リプレイ周期、BZシナリオ、設定変更後の恩恵は個別加算していない。
#   - 天井到達時のAT性能差は未確認のため通常当選と同じ平均獲得を使用。
#   - AT終了後はエンタチャンスの1G確認が基本。復帰分は別加算していない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 等価 200G(-308円)→300G(+121円)/5.6枚持ち 200G(-275円)→300G(+108円)/
# 5.6枚現金 450G(-59円)→500G(+331円)
# 出典の「狙い目」(時給1,000円基準): 等価400G/持ち420G/現金540G前後〜。
# 補足の狙い目(テーブル化していない): CZ間250G前後〜(0〜3スルー)、4スルーはCZ間180G
# 前後〜、5スルー以上はG数不問、リプレイ周期は4周期目15/20前後〜・5周期目5/20前後〜。
#
# 【データ範囲】
# 0〜950G(300G以降は50G刻み)。950G超はengine仕様によりNone(様子見)。
# 転記したテーブルが単調増加であることを確認済み(非単調注記なし)。

id: mhrsb
name: "スマスロ モンスターハンターライズ:サンブレイク"
summary: "AT間999G+α天井(設定変更でも短縮なし)が主軸。CZ間333G+α・CZ6スルー天井・リプレイ周期(最大5周期)は補足の狙い目で、判定には未反映。"
ev_policy_note: >
  AT終了後は1G目のエンタチャンス(レア役でAT復帰)を確認し、非レア役かつ別の続行
  理由がなければヤメる前提の期待値です(出典のやめどき)。CZ間333G天井、CZスルー
  回数(5スルー以上はG数不問で狙い目候補)、リプレイ周期(4周期目後半・5周期目)、
  設定変更後の恩恵は金額に反映されていません。これらが進んでいる台は表より有利に
  見てください。
header_image: "assets/badges_mascot/mhrsb.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のAT間ゲーム数(最大999G+α。設定変更でも短縮されない)"
    type: integer
    default: 0

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # AT間天井の単一テーブル群しか使わないため、table_select_axisに常にtrueを返す
  # 定数を割り当てる。cycleの概念もないため全行1のダミー周期(sao2.yamlと同じ手法)。
  - key: always_main
    expr: "True"
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: always_main
    table_select_true: at_ceiling
    table_select_false: at_ceiling
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・AT間天井基準)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(950G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1を仮定した攻略サイト(slot-toolbox.com)の算出値であり、実際の
  設定・実戦データによる補正ではない。AT間999G天井は設定変更でも短縮されないため、
  据え置き・リセット問わず同じテーブルを参照する。設定変更後の「規定リプレイ回数の
  加算・初回AT恩恵」は出典の期待値表に加算されていない。

  CZ間333G天井・CZスルー天井・リプレイ周期天井は、出典に狙い目の目安はあるが円換算の
  期待値表が無いため判定には使っていない(ev_policy_noteに目安を記載)。

  出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深いため、本プロファイルの
  rules(EV=0±200円)は出典の狙い目より早く「様子見」「続行推奨」に転じる。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

