# Lパチスロ 炎炎ノ消防隊2(炎炎2)機種プロファイル
#
# 【機種情報(確認済み)】
# メーカー:SANKYO。タイプ:AT機・スマスロ。導入日:2026年2月2日。
# 純増約5.8枚/G、ベース33.1G、コイン単価3.20円。
# 設定1:初当り1/272、初AT1/684、機械割97.7% / 設定6:初当り1/227、初AT1/486、
# 機械割114.9%(設定差が大きく、高設定示唆が出た場合は天井狙いより設定狙いが
# 合理的、と出典サイトも明記)。
# 出典: https://flick7.net/slot/fire_force2/tenjo/ (2026年9月14日取得、curlで
# 生HTML取得) 、https://flick7.net/slot/fire_force2/reset/ (同日取得)
#
# 【天井システム(重要・2系統が独立)】
# 本機は「ボーナス間天井」と「炎炎ループ間天井」という2つの独立したゲーム数
# カウンターを持つ(とある魔術の禁書目録2=toaru_index2.yamlに近い構造)。
#   - ボーナス間天井: 通常850G+α / 設定変更後(リセット)650G+α
#   - 炎炎ループ間天井: 通常2000G+α / リセット1500G+α(到達でSPエピソード
#     ボーナス=炎炎激闘濃厚)
# 上記の数値は flick7.net(2ページ)・slobase.jp(2記事)・note.com(下記参考記事)
# の4ソースすべてで完全一致することを確認済み。
#
# 【円換算期待値データについて(重要・炎炎ループ間天井にはテーブルが無い)】
# flick7.net「天井狙い」ページはG数区間別の期待値表そのものが
# 「導入以降、順次公開予定」(coming-soon)扱いで、2026年9月14日時点では未公開
# だった(天井仕様の記述のみ利用)。
# 円換算の期待値テーブルが実際に見つかったのは slobase.jp のみで、tables以下の
# 数値はslobase.jp「炎炎ノ消防隊2 天井期待値ガイド」の「通常時の期待値テーブル」
# 「リセット時(650G+α)の短縮期待値」(いずれも50G刻み・等価換算)をcurlで生HTML
# (Next.jsのReact Server Componentsペイロード内の文字列)を取得しRead toolで
# 実際の数値文字列を目視確認した上で転記したもの(WebFetchのAI要約は使っていない)。
# 炎炎ループ間天井については、slobase.jp本文が「ST関連の長期天井で滅多に到達
# しないため、期待値テーブルもボーナス間天井基準で算出されています」と明記して
# おり、この系統専用の円換算テーブルは(flick7.net・slobase.jpのどちらにも)存在
# しない。数値を捏造しない方針のため、この系統はev_lookupsに含めず、
# loop_game_count軸として参考表示専用で実装した(sao2.yamlのcz_real_game_count
# と同じ扱い)。
# 出典: https://slobase.jp/articles/enen2-expected-value (2026年9月14日取得)
#
# 【出典サイト間の食い違いについて(重要・光さんへの注意喚起)】
# 参考記事として指定されたnote.com記事(シオン@期待値研究所「【炎炎ノ消防隊2】
# リセット狙いが超強力!」、実戦サンプル数百万G規模と明記)にも、部分的に生の
# 円換算期待値(等価・%表示付き)が掲載されている:
#   【AT後(通常)】400G:+127円(100.6%) / 600G:+786円(104.4%) /
#                 700G:+1,712円(111.6%) / 800G:+4,025円(138.6%)
#   【リセット】  150G:-781円(95.3%) / 300G:-1,930円(89.3%)
#                 ※250Gゾーン抜け直後のため下がる、との注記あり /
#                 550G:+651円(105.7%) / 600G:+2,109円(124.4%)
# これをslobase.jpの同一G地点の値(通常600G:+2,306円/700G:+3,818円/800G:+5,963円、
# リセット300G:+837円)と比べると、同じ「等価」表記にもかかわらず最大3倍近く
# 数値が異なる。原因は算出方法の違いと考えられる:slobase.jpは「基本スペックに
# 基づく」理論値(仕様上の平均値からの計算)、note.com記事は「実戦サンプル
# 数百万G」に基づく実戦値ベースの集計で、両者は性質の異なる数値。特にリセット
# 300G地点はnote.com側が「250Gゾーン(内部モード通常D/Eの天井)を抜けた直後は
# 有利モードの可能性が一部否定されるため期待値が一時的に下がる」という、本
# プロジェクトがモンキーターンVで確認済みの「状態の境界をまたぐと非単調に
# 変化する」現象と同種の実例を明示している。本プロファイルのev_lookupsは
# 唯一の連続テーブルであるslobase.jpの値を採用しているが、このテーブルは
# 50G刻みの滑らかな増加曲線で、上記の250G地点前後の落ち込みを表現できていない
# 可能性がある。次の狙い目G数付近(250〜350G)は特に、期待値表の数値を額面通り
# 信頼しすぎないこと。実戦ログが貯まったら、光さん自身のデータで検証・補正する
# こと。
# 出典: https://note.com/kitaitilabo/n/nd6d6c7e7b75a (2026年9月14日取得)
#
# 【内部モード別天井・リセット時選択率(参考情報・期待値円額には未反映)】
# slobase.jp「炎炎ノ消防隊2 リセット判別と朝イチ通常D/E天井狙い完全ガイド」
# (https://slobase.jp/articles/enen2-reset 、2026年9月14日取得)の内部モード表
# より、リセット時(設定変更後)の内部モード別天井G数・選択率:
#   通常A: 850G+α(リセット時は選択されない) / 通常B: 650G+α(約24%) /
#   通常C: 450G+α(約4%) / 通常D: 250G+α(約39%) / 通常E: 88G+α(約33%)
#   (通常D+E合算で約72%。リセット時はA非選択のため、B/C/D/Eのいずれかに
#   必ず滞在する)
# 上記の「85G刻みで書くと250G/450G/650G地点がゾーン(モード天井)の境目に
# あたる」という構造が、上のnote.com記事が指摘する300G地点の落ち込みの
# 直接の原因と考えられる(250Gが通常D/Eの天井=ここで否定されると通常B/Cが
# 濃厚化するが、すぐには当たらず一段落ち込む、という動き)。
#
# 【交換レートについて(重要・他機種と異なり1区分のみ)】
# 上記の通り、円換算の連続テーブルを公表しているのはslobase.jpのみで、同サイトは
# 「等価」列しか掲載していない(5.6枚持ちメダル/5.6枚現金の換算列は無い)。
# note.com記事は「5枚等価」「5.6枚現金」の2区分の狙い目G数(損益分岐ラインでは
# なく、時給2,000円/機械割105〜106%を狙うためのより保守的な基準線)を掲載して
# いるが、これはしきい値G数の一覧であって50G刻みの連続テーブルではないため、
# tables側に転記できる形のデータではない。数値を推測で埋めることも禁止されて
# いるため、本プロファイルのexchange_rateは実際にテーブルが存在する「等価」の
# 1区分のみとした(他機種プロファイルの「等価/5.6枚持ちメダル/5.6枚現金」
# 3区分、tokyo_ghoul.yaml等の2区分パターンよりさらに絞った形)。2026年9月の
# 光さんの指示(交換レートは保守的な区分をデフォルトにする)は、本機では
# 選べる区分が1つしかないため適用のしようがなく、その等価区分をそのまま
# デフォルトにしている。実戦の交換レートが等価より不利な場合、表の期待値より
# 実際の収支は悪くなる点に注意。note.comの「5.6枚現金」しきい値(通常700G〜/
# リセット後700G未提示だが炎炎ループ間1700G〜等)を参考程度に上でnotes欄へ
# 転記済み。
#
# 【リセット恩恵の強さ(実際に転記した数値からの要約)】
# slobase.jpの等価テーブルによれば、通常時の損益分岐は約309G(サイト本文の
# 要約値)、リセット時は約185G(同)。転記した50G刻みの数値で見ると、
# 通常時は300G:-44円→350G:+198円の間でプラス転換、リセット時は150G:-204円→
# 200G:+84円の間でプラス転換しており、リセット恩恵にして概ね150G分、天井狙いの
# 開始ラインが早まる計算になる。

id: fire_force2
name: "Lパチスロ 炎炎ノ消防隊2"
summary: "ボーナス間天井(通常850G+α/リセット650G+α)基準の等価期待値のみ利用可能。炎炎ループ間天井(通常2000G+α/リセット1500G+α)は参考表示のみで期待値テーブルなし。"
ev_policy_note: >
  ボーナス間天井(通常850G+α/設定変更後650G+α)到達または自然当選まで打ち続ける
  ことを前提にした期待値です(出典サイトの算出条件・算出前提に基づく)。
  交換レートは出典に「等価」列しか存在しないため等価換算のみで判定しています。
  実際の交換レートが等価より不利な場合、表の数値より実際の収支は悪化します。
  注意:内部モード(通常A/B/C/D/E)には250G+α・450G+α・650G+α・850G+αという
  段階的な天井があり、あるモードの天井(特にリセット後の250G地点)を抜けた
  直後は「そのモードではなかった」ことが確定するため、期待値が一時的に
  下がることがあります。本プロファイルのテーブル(50G刻みの滑らかな曲線)は
  この落ち込みを完全には表現できていない可能性があるため、250〜350G付近の
  数値は特に額面通り信頼しすぎないでください。
header_image: "assets/fire_force2.jpg"

axes:
  - key: current_game_count
    label: "現在のボーナス間消化ゲーム数(通常850G+α天井/設定変更後650G+α天井)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。データカウンター表示から直接観測する値。

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か"
    type: boolean
    default: true
    # 期待値テーブルのどちらの表(通常時/設定変更後)を参照するかを決める。
    # この機種はリセット恩恵が非常に強いことで知られており(出典のnote.com
    # 記事も「リセット狙いを主軸に」と結論づけている)、v1のデフォルトは
    # リセット濃厚側にしている。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価"]
    default: "等価"
    # この機種は円換算の連続テーブルを公表している出典(slobase.jp)が「等価」
    # 列しか持たないため、他機種プロファイルのような複数区分の選択肢を
    # 用意できない(詳細はファイル冒頭コメント参照)。実際の交換レートが
    # 等価より不利な場合、期待値は表の数値より悪化する。

  - key: loop_game_count
    label: "現在の炎炎ループ間ゲーム数(参考表示のみ・通常2000G+α/リセット時1500G+αが天井。円換算期待値テーブルなし)"
    type: integer
    optional: true
    # 判定(期待値テーブル参照)には使わない。この系統は出典サイトが円換算の
    # 期待値テーブルを公表していない(ボーナス間天井に比べて滅多に到達しない
    # 長期天井のため)ための参考表示専用の入力(sao2.yamlのcz_real_game_count
    # と同じ扱い)。

derived:
  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数(toaru_index2.yaml/sao2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・等価換算・ボーナス間天井基準)"
    table_true_label: "設定変更後(リセット、650G+α)"
    table_false_label: "通常時(据え置き、850G+α)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  # この機種は出典間の数値差が大きい(ファイル冒頭コメント参照)ため、
  # 通常の機種以上にこのバッファ付近の判定は参考程度に留めること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定・等価換算)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定・等価換算)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定・等価換算)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年2月2日導入(SANKYO製、純増約5.8枚/G、ベース33.1G、コイン単価3.20円)。
  設定1:機械割97.7%(初当り1/272)、設定6:機械割114.9%(初当り1/227)と設定差が
  大きく、出典サイトも高設定示唆が出た場合は天井狙いより設定狙い継続を推奨して
  いる。

  ボーナス間天井(通常850G+α/リセット650G+α)と炎炎ループ間天井(通常2000G+α/
  リセット1500G+α)という独立した2系統の天井を持つが、円換算の期待値テーブルが
  実在するのはボーナス間天井のみ(出典:slobase.jp)。炎炎ループ間は「滅多に
  到達しないため期待値テーブルもボーナス間天井基準で算出」と出典サイト自身が
  明記しており、円額データが存在しないため参考表示専用(loop_game_count)に
  留めている。

  【内部モード別天井・リセット時選択率(参考・判定には未使用)】
  出典:slobase.jp「炎炎ノ消防隊2 リセット判別と朝イチ通常D/E天井狙い完全
  ガイド」。リセット時(設定変更後)は通常A(850G+α)が選択されなくなり、
  通常B(650G+α・約24%)/通常C(450G+α・約4%)/通常D(250G+α・約39%)/
  通常E(88G+α・約33%)のいずれかに必ず滞在する(D+E合算で約72%)。250G・
  450G・650Gがモード天井の境目にあたり、期待値テーブルの起伏(特に250G
  付近)と対応している可能性が高い。

  【出典間の数値差について(重要)】
  参考記事note.com(シオン@期待値研究所、実戦サンプル数百万G規模)が掲載する
  実戦値ベースの期待値(例:リセット300G地点で-1,930円/89.3%、「250Gゾーン
  抜け直後のため下がる」との明記あり)は、本プロファイルが採用したslobase.jp
  の理論値ベースの期待値(同地点で+837円)と大きく異なる。両者は算出方法
  (理論値 vs 実戦サンプル)が異なるため単純にどちらかが誤りとは言えないが、
  特にリセット時の250〜350G付近は数値の振れ幅が大きいと認識しておくこと。
  実戦ログが十分に貯まった段階で、光さん自身のデータでどちらの傾向に近いかを
  検証・補正すること。

  交換レートは出典(slobase.jp)に等価列しかないため、本プロファイルの
  exchange_rateは「等価」の1区分のみで実装している(他機種プロファイルより
  少ない)。実際の交換レートが等価より不利な場合、期待値は表の数値より
  悪化する点に留意。

