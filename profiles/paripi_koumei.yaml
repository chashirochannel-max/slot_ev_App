# スマスロ パリピ孔明 機種プロファイル
#
# 【機種情報】
# 山佐ネクスト製(型式名 Lパチスロパリピ孔明YE05H)、2026年10月5日導入のATタイプ。
# ボーナス初当り1/309.9(設定1)〜1/228.8(設定6)、CZ 1/213.6〜1/171.7、
# 出玉率97.6%〜113.6%、通常時ベース約31G/50枚(設定1)、純増約4.2枚/G、
# ST「パーティータイム」15G+α/継続率約73%、平均獲得約450枚(業界向け販売スペック)。
#
# 【天井システム】
#   - 通常時: ボーナス間1009Gで初当りボーナス。
#   - 設定変更後・ST駆け抜け後: ボーナス間428Gへ短縮(どちらも同じ428G)。
#   - CZ間: ステージチェンジ20周期目でCZ当選濃厚(約32Gごとのステージチェンジ)。
#   - 3連続駆け抜け後は無中生有ポイントの恩恵発動濃厚。
# 出典の期待値表は「通常1009G」と「428G短縮(設定変更後・ST駆け抜け後の共通目安)」
# の2本。world_dystar.yamlと同じく、短縮条件が複数(設定変更・駆け抜け)あるため
# boolean軸名はshort_ceiling_activeとした。
#
# 【この期待値データについて(重要)】
# slot-toolbox.com「スマスロ パリピ孔明 天井期待値・狙い目・やめどき」の
# 「💰 天井期待値・狙い目ライン」の2表を転記したもの。WebFetchのAI要約は使わず、
# curl -s -A "Mozilla/5.0" で取得した生HTML/タグ除去テキストを目視で確認して転記。
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\paripi-koumei.html / paripi-koumei.txt
# 出典: https://slot-toolbox.com/paripi-koumei-tenjo/ (2026年10月29日取得)
#
# 【期待値表の前提条件(出典ページ本文より要約)】
#   - 設定1のボーナス初当り1/309.9・出玉率97.6%・通常時約31G/50枚・ボーナス間天井が基準。
#   - 平均獲得約450枚(業界向け販売スペック)を出玉の基準とし、出玉率97.6%との整合も考慮。
#   - ST継続率約73%を基準に、ST駆け抜け後の428G短縮を長期平均の初当りへ反映。
#   - 非駆け抜けのST終了後は明確な続行理由がなければ即ヤメが基本。
#   - 現在周期・5の倍数周期・CZ間20周期までの残り、無中生有ポイントの恩恵(3連続駆け
#     抜け後・設定変更時の初期ポイント優遇を含む)、109G後の士気高揚ゾーン優遇、
#     閉店取り切れずは基本表へ個別加算していない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 通常(1009G): 等価 400G(-45円)→500G(+618円)/5.6枚持ち 400G(-40円)→500G(+552円)/
#              5.6枚現金 500G(-380円)→600G(+501円)
# 428G短縮: 0G時点で全レートともプラス(等価+1,312円/持ち+1,172円/現金+314円)
# 出典の「狙い目」(時給1,000円基準): 通常 等価500G/持ち510G/現金610G前後〜、
# 428G短縮 等価0G/持ち0G/現金30G前後〜。
#
# 【データ範囲・扱わなかったもの】
#   - 通常テーブルは0〜950G(天井1009Gの手前まで)、短縮テーブルは0〜400G。
#     それを超える入力はengine仕様によりNone(様子見)。
#   - CZ間20周期天井は期待値表が無いためテーブル化していない(ev_policy_noteに記載)。
#   - 転記した全テーブルが単調増加であることを確認済み(非単調注記なし)。

id: paripi_koumei
name: "スマスロ パリピ孔明"
summary: "ボーナス間1009G天井。設定変更後・ST駆け抜け後は428Gに短縮され、短縮中は0Gから期待値プラス。CZ間はステージチェンジ20周期が天井(判定には未反映)。"
ev_policy_note: >
  ST中にボーナス当選があった後は即ヤメ、ST駆け抜け時は428G短縮のため次回ボーナス
  まで続行する前提の期待値です(出典のやめどき)。前兆中・赤カウンター・CZ濃厚法則
  など明確な続行理由がある場合のみ取り切ります。CZ間20周期天井(深い周期ほど有利)、
  無中生有ポイントの恩恵、109G後の士気高揚ゾーン優遇は金額に反映されていません。
  周期が深い状態で500Gを超えている台などは表より強めに見てください。
header_image: "assets/badges_mascot/paripi_koumei.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のボーナス間ゲーム数(リール右下の表示)"
    type: integer
    default: 0

  - key: short_ceiling_active
    label: "天井が428Gに短縮されている状態か(設定変更後・ST駆け抜け後のいずれか)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # cycleの概念はない。tables側の各行はcycle列を全行1で埋めており、そこと一致
  # させるための定数(bakemonogatari.yaml・world_dystar.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: short_ceiling_active
    table_select_true: short
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・ボーナス間天井基準)"
    table_true_label: "428G短縮(設定変更後・ST駆け抜け後)"
    table_false_label: "通常(1009G天井)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常950G超/短縮400G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1を仮定した攻略サイト(slot-toolbox.com)の算出値であり、実際の
  設定・実戦データによる補正ではない。平均獲得約450枚は業界向け販売スペックの値。
  428G短縮テーブルは設定変更後とST駆け抜け後の共通目安として出典が1本で掲載して
  いるもので、両状態の差(設定変更時の無中生有ポイント初期優遇など)は区別されて
  いない。

  通常テーブルは0〜950G、短縮テーブルは0〜400Gまで。それを超える入力はデータ範囲外
  (様子見)扱いになる。CZ間20周期天井は円換算の期待値表が出典に無いため判定に
  使っていない。

  出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深いため、本プロファイルの
  rules(EV=0±200円)は出典の狙い目より早く「様子見」「続行推奨」に転じる。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

