# スマスロ 甲鉄城のカバネリ 海門決戦 機種プロファイル
#
# 【機種確認(重要)】
# 依頼文の「甲鉄城のカバネリ 海門決戦」について、P-WORLD公式機種データベース
# (https://www.p-world.co.jp/machine/database/10399、2026年9月13日取得)を
# curlで取得し確認した結果、以下が確定した:
#   - 正式名称: スマスロ 甲鉄城のカバネリ 海門(うなと)決戦
#   - 型式名: L 甲鉄城のカバネリ 海門決戦 XX
#   - 機種ラベル: パチスロ / スマスロ / AT(ページ内kisyuTagで確認)
#   - 検定番号: 5S1358 / 6.5号機
#   - メーカー(発売元): サミー(ロゴリンクもsammy.co.jpを指す)
#   - 製造: タイヨーエレック
#   - 導入開始日: 2026年3月2日
#   - 機械割: 97.5%〜114.9%
# 「甲鉄城のカバネリ」原作を用いたパチンコ版(e甲鉄城のカバネリ2 咲かせや燦然、
# 銀座ニューギン製、database/10400)が別途存在するため混同注意。検索結果の一部
# (WebSearchのAI要約)には本機を「タイヨーエレック製」とだけ表示するものが
# あったが、これはP-WORLDページ内の「製造」欄(実際の製造委託先)であり、
# 「メーカー(発売元)」欄はサミーである。ページ内ラベルでは「パチスロ」「スマスロ」
# 「AT」と明記されており、パチンコ機ではない。
#
# 【天井システム】
# 独立した2系統の天井が並走し、どちらか早く到達した方でエピソードボーナス
# (ST「KABANERI OF THE IRON FORTRESS」濃厚)に当選する:
#   - ゲーム数天井: 通常時は最大996G+α。設定変更後・通常ST駆け抜け後・
#     景之ST後は596G+αに短縮
#   - 周期天井: 通常時は最大6周期。設定変更後・通常ST駆け抜け後・景之ST後は
#     最大4周期に短縮
# 上記3つの短縮要因(設定変更後/通常ST駆け抜け後/景之ST後)は、ゲーム数天井・
# 周期天井のどちらも同時に同じ量だけ短縮するため、world_dystar.yamlや
# l_sengoku_musume5.yamlと同じ手法で1つのboolean軸(short_ceiling_active)に
# まとめた。
# 出典: https://www.p-world.co.jp/machine/database/10399 (P-WORLD公式、天井節)
#       https://slot-toolbox.com/kabaneri-unato-tenjo/ (2026年9月13日取得)
#       https://slobase.jp/machines/kabaneri-unato (2026年9月13日取得、天井FAQで
#       「通常996G+α(6周期)」「リセット後596G+α(4周期)」を確認、数値一致)
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slot-toolbox.com「スマスロ 甲鉄城のカバネリ 海門決戦
# 天井期待値・狙い目・やめどきまとめ」本文の「通常状態と短縮状態の共通天井
# 期待値表」を転記したもの。WebFetchのAI要約は信用せず、curlで生HTMLを取得し
# Read toolで<table class="ev-combined-table">内の実際のセル値を直接目視確認
# した上で転記している(攻略サイト側の算出値であり、公式一次情報ではない)。
# サイト本文には「通常状態と短縮状態は、基礎の当選条件・回収条件・天井恩恵を
# 共通にし、ゲーム数天井の差だけを反映しています」「対応関係:短縮0G＝通常
# 400G、短縮50G＝通常450Gとして同じ行で確認できます」と明記されており、
# l_sengoku_musume5.yamlのnormal/short(オフセット349G)と同じ構造。本機は
# オフセット400G(=996G-596Gの天井短縮量)で、normal(通常時G数キー、0〜950G)
# /short(短縮時G数キー、0〜550G)の2テーブルに分解して転記した。転記した
# 数値は下記スクリプトでアサーション検証済み(各レート列の単調増加、
# 5.6枚現金が他の2レートより常に低いこと(等価/持ちメダルの大小は0〜100G付近
# で逆転するが、これはworld_dystar/l_sengoku_musume5/toaru_index2の既存テーブル
# にも共通して見られる実データ上の特徴であり捏造・誤記ではない)、
# short/normalの400Gオフセット対応関係が完全一致すること):
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\build_kabaneri_table.py
# 前提条件(ページ内の記載による):
#   - 設定1ベース。通常時約31.4G/50枚、ST初当り1/422.5、ST終了後1Gヤメを
#     基準にした算出値
#   - 150G・300G付近(周期前兆否定後)は個別条件として扱っていない。周期到達
#     直前・前兆中は表より有利、前兆否定後は表より辛めに見るようサイト側が
#     注記している
#   - 着席時の現在周期、短縮時最大4周期の個別価値、皮膜Lv、背景示唆、黒煙
#     ポイント、輪廻くじ、CZアイコン、景之STループ、閉店欠損は個別加算して
#     いない(=周期は判定(ev_yen)には反映されない。後述)
# 出典: https://slot-toolbox.com/kabaneri-unato-tenjo/ (2026年9月13日取得)
#
# 【データ確度に関する注記(重要)】
# 別の解析サイトslobase.jp(https://slobase.jp/machines/kabaneri-unato)の
# FAQセクション(curlで取得後、文字化けを避けるためPythonでUTF-8のまま
# 再確認)には円換算の連続テーブルはなかったが、以下の目安値が記載されており、
# 本プロファイルの採用元(slot-toolbox.com)テーブルとの整合性を確認できた:
#   - 「通常天井(996G)狙いの場合、570G〜が目安。期待値は570Gで約+2,200円」
#     → slot-toolboxの通常テーブル(5.6枚現金)を570Gで線形補間すると約+2,305円
#     となり、ほぼ一致(検証スクリプトで確認)。
#   - 「リセット確認後は60G〜が狙い目。天井が596G/4周期に短縮されるため、
#     0Gから期待値約+1,000円のプラス」
#     → slot-toolboxの短縮テーブル0G地点は5.6枚現金+382円〜等価+1,739円の
#     レンジにあり、slobaseの目安値+1,000円はこのレンジ内に収まる。
# 天井ゲーム数・周期数(996G+α/6周期、596G+α/4周期)自体もslobase.jpの
# FAQと完全一致しており、両サイトが独立に同じ仕様・近い期待値水準を算出して
# いることを確認した(world_dystar.yaml等で見られた「slot-toolboxがやや楽観的」
# という傾向ほど大きな差はなく、今回は両サイトの整合性が高い)。
#
# 【周期・周期別当選率を判定に使わない理由】
# slot-toolbox.comは周期別の当選率(設定1で3周期目18.4%、4周期目33.6%等)を
# 公開しているが、これは「ボーナス当選確率」(%)であり円換算の期待値ではない。
# 円換算の期待値表はST間ゲーム数のみを基準にしたものであり、サイト側も
# 「着席時の現在周期...は個別には加算していない」と明記している。数値を
# 捏造しないという方針上、current_cycleはev_yenの判定(ev_lookups)には使わず、
# 参考表示専用の軸として残した(l_sengoku_musume5.yamlのcurrent_cycleと同じ
# 扱い)。ただし、周期天井(通常6周期/短縮4周期)への到達は「エピソード
# ボーナス当選確定」という金額を伴わない確定事実(P-WORLD公式・slot-toolbox・
# slobaseの3ソースで一致)であるため、この到達判定のみはderived/rulesで
# 明示的に評価し、円換算EVがまだマイナス圏でも「続行推奨」にできるように
# した(lycoris_recoil.yamlの天井到達ルールと同じ考え方)。
#
# 【周期別当選率の内訳(参考・判定には未使用、notes/ev_policy_noteにも転記)】
# slot-toolbox.comが公開する周期到達G数・当選率の目安(設定1):
#   1周期目: 平均約100G・最大150Gで到達、ボーナス期待度は約33%以上
#   2周期目: 平均約250G・最大300Gで到達、ボーナス期待度は約33%以上
#   3周期目: 設定1のボーナス当選率18.4%(規定カバネポイントが浅い)
#   4周期目: 設定1のボーナス当選率33.6%(短縮時はここが周期天井)
#   5周期目: 当選率は攻略サイト側も「現在調査中」で数値未公表
#   6周期目: 通常時の周期天井(到達で確定当選)
# 3周期目より4周期目の方が当選率が高く上下する(=モンキーターンVで確認済みの
# 「周期の切れ目ごとに有利な条件が否定される」非単調カーブと同種の現象が
# ここでも起きている可能性がある)が、円換算のEVカーブ自体は本機の場合ST間
# 実ゲーム数のみに基づく単調増加テーブルであり、周期の非単調性はこの金額表には
# 反映されていない(サイト側が個別加算していないとする対象そのもの)。

id: kabaneri_kaimon_kessen
name: "スマスロ 甲鉄城のカバネリ 海門(うなと)決戦"
summary: "ST間ゲーム数天井(通常996G+α/短縮596G+α)と周期天井(最大6周期/短縮4周期)が並走。円換算期待値はST間ゲーム数基準、周期到達は確定当選として別枠で判定。"
ev_policy_note: >
  ST間ゲーム数天井(通常996G+α/短縮596G+α)到達または自然当選まで打ち続け、
  ST終了後は追加で粘らず1Gでヤメることを前提にした期待値です(出典サイトの
  算出条件「ST終了後1Gヤメ」)。周期(通常6周期/短縮4周期)が深いほどボーナス
  当選率は上がりますが、この上振れは円換算の期待値には反映されていません
  (出典サイトが「現在周期は個別に加算していない」と明記)。一方、周期天井
  そのものへの到達(通常6周期/短縮4周期)はエピソードボーナス当選が確定する
  事実のため、円換算期待値とは別に「周期天井到達」を独立した続行推奨条件として
  判定しています。皮膜Lv・サブ液晶背景・黒煙ポイント・輪廻くじ・景之STループ
  等の示唆による上振れも金額には反映されていません。
header_image: "assets/badges_mascot/kabaneri_kaimon_kessen.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のST間消化ゲーム数(通常996G+α天井/短縮596G+α天井、共通のデータカウンター表示)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。データカウンター表示から直接観測する値。

  - key: short_ceiling_active
    label: "天井が短縮されている状態か(設定変更後・通常ST駆け抜け後・景之ST後のいずれか)"
    type: boolean
    default: false
    # 期待値テーブルのどちらの表(通常996G+α用/短縮596G+α用)を参照するかを決める。
    # 3つの短縮要因はゲーム数天井・周期天井を同時に同じ量だけ短縮するため、
    # 1つのboolean軸にまとめている(world_dystar.yamlのshort_ceiling_activeと同じ手法)。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。
    # 期待値テーブル(tables)のどのレート区分を参照するかを選ぶ。

  - key: current_cycle
    label: "現在の周期数(液晶・サブ液晶表示。通常最大6周期/短縮時最大4周期。円換算期待値の判定には未反映、周期天井到達判定にのみ使用)"
    type: integer
    default: 1
    optional: true
    # メインの判定(ev_yen、ST間ゲーム数基準)には使わない。入力すると、周期
    # 天井(通常6周期/短縮4周期)に到達しているかどうかだけを別途判定し、
    # 到達していれば円換算EVがマイナス圏でも「続行推奨」にする
    # (エピソードボーナス当選確定という事実に基づくルール、l_sengoku_musume5.yaml
    # のcurrent_cycleと同じく参考表示用の軸として残している)。

derived:
  # この機種のev_yenテーブルはST間ゲーム数のみを基準にしており、周期別には
  # 分かれていない(サイト側も個別加算していないと明記)。tables.normal/short
  # の各行はcycle列を全行1で埋めており、そこと一致させるための定数。これにより
  # engineの2次元(cycle×game_count)ルックアップ機構をそのまま1次元テーブルと
  # して流用できる(world_dystar.yaml/l_sengoku_musume5.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

  # 周期天井は短縮時4周期・非短縮時6周期(P-WORLD公式・slot-toolbox・slobaseの
  # 3ソースで一致した確定事実)。
  - key: cycle_ceiling_max
    expr: "4 if short_ceiling_active else 6"

  # current_cycleが入力されている場合のみ、周期天井への到達可否を判定する。
  - key: cycle_ceiling_reached
    expr: "defined(current_cycle) and current_cycle >= cycle_ceiling_max"

# 期待値テーブル参照の設定。short_ceiling_activeでnormal/shortのどちらの表を
# 見るか、exchange_rateでどのレート区分を見るかを決め、dummy_cycle(常に1で
# 完全一致)とcurrent_game_count(前後の行を線形補間)で該当する期待値(円)を引く。
# 結果はev_yenという名前でderived/rulesから参照できるようになる。
ev_lookups:
  - table_select_axis: short_ceiling_active
    table_select_true: short
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・ST間ゲーム数基準)"
    table_true_label: "短縮天井(設定変更後・通常ST駆け抜け後・景之ST後)"
    table_false_label: "通常天井(据え置き)"

rules:
  # 周期天井到達は円換算EVとは独立した確定事実(エピソードボーナス当選確定)
  # のため最優先で判定する。ev_yenがまだマイナス圏でも続行推奨にする。
  - id: cycle_ceiling_reached_rule
    condition: "cycle_ceiling_reached"
    result: "続行推奨"
    reason: "周期天井(通常6周期/短縮時4周期)に到達しています。エピソードボーナス当選が確定する周期のため続行が有力です(P-WORLD公式・攻略サイト共通で確認済みの確定事項。円換算の期待値とは別枠の判定です)。"

  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定・ST間ゲーム数基準)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定・ST間ゲーム数基準)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定・ST間ゲーム数基準)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年3月2日導入(サミー発売/タイヨーエレック製造、検定番号5S1358、6.5号機)。
  P-WORLD公式機種データベース(machine/database/10399)でパチスロ/スマスロ/AT
  機種であることを確認済み。「甲鉄城のカバネリ」原作の別バージョンとして
  パチンコ版(e甲鉄城のカバネリ2、database/10400)が同時期に存在するため、
  今後この機種の情報を追加調査する際はdatabase/10399(スマスロ・海門決戦)を
  参照すること。

  天井はST間ゲーム数(通常996G+α/短縮596G+α)と周期(通常最大6周期/短縮最大
  4周期)の2系統が並走し、どちらか早く到達した方でエピソードボーナスに当選
  する。円換算の期待値テーブルはST間ゲーム数のみを基準にしたもので、周期は
  判定に反映されない(出典サイトが個別加算していないと明記)。そのため
  current_cycleは参考表示専用の軸として残しつつ、周期天井そのものへの到達
  (円換算不要の確定事実)だけは別ルールとして評価し、ev_yenがマイナス圏でも
  「続行推奨」にできるようにしている。

  期待値はすべて設定1(最低設定)を仮定した攻略サイト(slot-toolbox.com、
  2026年9月13日取得)の算出値であり、実際の設定・実戦データによる補正ではない。
  別の解析サイトslobase.jpのFAQ目安値(570Gで約+2,200円、リセット後0Gで
  約+1,000円)と突き合わせ、slot-toolboxのテーブルから補間した値(570Gで
  約+2,305円)や短縮0G地点のレンジ(+382円〜+1,739円)にほぼ収まることを
  確認済み(検証スクリプトbuild_kabaneri_table.py参照)。導入から日が浅く
  実戦データの蓄積も薄いため、実戦ログが十分に貯まった段階で、光さん自身の
  データと突き合わせて閾値やテーブル自体を補正すること。

