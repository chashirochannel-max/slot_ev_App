# スマスロ 戦国コレクション6(コナミ、2026年7月6日導入) 機種プロファイル
#
# 【天井システムの仕組み(複数サイトで裏取り済み)】
# 「999G+α消化」または「6周期消化(規定コレ数到達を6回)」のいずれか早い方でAT
# 「時幻城ラッシュ」当選濃厚。設定変更(リセット)時は周期天井が6周期→3周期に
# 短縮され、かつ1周期目の規定コレ数が222以下に短縮される恩恵がある。
# 規定コレ数は111/222/333/444/555/666の3桁ゾロ目6種のいずれか(周期ごとに抽選)。
# 別途「鬼ヶ島チャレンジ/CZのハマりが130Gを超えた場合、次回レア役成立でCZ当選
# 濃厚」という救済もあるが、これは天井というより恩恵ゾーンに近く、期待値化された
# データが見つからなかったため本プロファイルでは扱わない。
#
# 【期待値データについて(重要)】
# 見つかった期待値表は「打ち出しG数(AT間ゲーム数)」のみを軸にした単純化モデルで、
# 周期(コレ数)側の天井は考慮していない(=周期天井による早期AT当選の可能性は
# 加味されていない、その意味でやや保守的な=控えめな期待値になっている可能性がある)。
# 周期数・規定コレ数ごとの期待値テーブルは、調査した範囲(flick7.net,
# slot-toolbox.com, nana-press.com, chonborista.com, 1geki.jp, slobase.jp)では
# 見つからなかった。そのため本プロファイルはtoaru_index2.yamlと同様、
# dummy_cycle=1の定数derivedを使い、ゲーム数のみの1次元テーブルとして扱う。
#
# 期待値表の出典: nana-press.com「戦国コレクション6の天井期待値や恩恵・狙い目と
# ヤメ時まとめ」(https://nana-press.com/kaiseki/machine/1156/37682/)内の
# 「天井期待値【暫定版】」表を転記。
# 前提: 設定1(最低設定)、コイン持ち33.7G/50枚、純増3.0枚/G固定、
# AT終了後即ヤメ、周期天井は考慮せず(ゲーム数天井999Gのみを基準とした試算)。
# 裏取り: slobase.jp(https://slobase.jp/machines/sengoku-collection6)にも
# 0G/400G/550G/700G/900Gの数値が部分的に掲載されており、等価・5.6枚交換の
# 両カラームで完全一致することを確認した(WebFetch要約が表を作文している
# 可能性を排除するための二重チェック)。またゲーム数が増えるほど期待値が
# 単調に上昇していることも確認済み(内部整合性チェック)。
# 交換レートは出典サイトが「等価交換」「5.6枚交換」の2区分のみで公開して
# いたため、本プロファイルでもこの2区分のみを採用する(他機種プロファイルに
# ある「5.6枚持ちメダル/5.6枚現金」の区分データは見つからなかったため、
# 存在しない区分を捏造しない)。
#
# 有利区間リセット恩恵(周期天井短縮・規定コレ数222以下)は、この単純化された
# ゲーム数のみのテーブルには反映されていない。reset_likely軸は参考表示専用
# (期待値計算には使わない)として残している。
#
# 実戦ログが十分に貯まったら、光さん自身のデータで検証・補正すること。

id: sengoku_collection6
name: "スマスロ 戦国コレクション6"
summary: "999G+αのゲーム数天井、または6周期消化で当選濃厚。設定変更後は周期天井が3周期に短縮(期待値には周期天井は未反映)。"
header_image: null

axes:
  - key: current_game_count
    label: "現在のAT間ゲーム数(打ち出しG数・ゲーム数天井は999G+α)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。画面表示から直接観測する値。

  - key: current_cycle
    label: "現在の周期数(参考表示のみ・期待値計算には未反映)"
    type: integer
    optional: true
    # 液晶に表示される周期数。周期別の期待値データが見つからなかったため
    # 判定には使わない。周期天井(6周期、リセット時3周期)が近いかどうかの
    # 参考情報として入力できる。

  - key: current_korre_count
    label: "現在のコレ数(参考表示のみ・期待値計算には未反映)"
    type: integer
    optional: true
    # 規定コレ数(111/222/333/444/555/666のいずれか)到達が近いかどうかの
    # 参考情報。判定(期待値テーブル参照)には使わない。

  - key: reset_likely
    label: "設定変更(リセット)濃厚か(参考表示のみ・期待値計算には未反映)"
    type: boolean
    default: false
    # リセット時は周期天井が6→3周期に短縮され、1周期目の規定コレ数も
    # 222以下に短縮される恩恵があるが、この恩恵を反映した個別の期待値
    # テーブルが見つからなかったため、判定には使わない参考項目とする。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚"]
    default: "等価"
    # 出典サイトが「等価交換」「5.6枚交換」の2区分のみを公開していたため、
    # この2区分のみを採用する。

derived:
  # ev_lookupsの仕組み上table_select_axis(boolean)が必須なので、常にtrueを
  # 返す定数を割り当てて固定している(toaru_index2.yamlと同じ手法)。
  - key: always_main
    expr: "True"

  # 見つかった期待値データは周期(コレ数)を考慮しない、ゲーム数のみの
  # 単純化モデルであるため、tables側の各行はcycle列を全行1で埋め、
  # そこと一致させるための定数を割り当てる。これによりengineの2次元
  # (cycle×game_count)ルックアップ機構を1次元テーブルとして流用できる。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: always_main
    table_select_true: main
    table_select_false: main
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・ゲーム数天井999G基準、周期天井は未考慮)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1(最低設定)を仮定した攻略サイト(nana-press.com)の算出値で
  あり、実際の設定・実戦データによる補正ではない。出典:
  https://nana-press.com/kaiseki/machine/1156/37682/
  (0G〜950Gの表を50G刻みで転記。slobase.jp
  https://slobase.jp/machines/sengoku-collection6
  にも0G/400G/550G/700G/900Gの数値が掲載されており、両者が完全一致することを
  確認済み)。
  前提: 設定1、コイン持ち33.7G/50枚、純増3.0枚/G固定、AT終了後即ヤメ、
  周期天井(6周期、リセット時3周期)は考慮せず、ゲーム数天井999Gのみを基準と
  した試算。そのため周期天井による早期AT当選の可能性が未加味であり、実際の
  期待値はこの表よりやや高い(控えめ)可能性がある。
  交換レートは「等価」「5.6枚」の2区分のみ(出典サイトの区分に準拠。
  他機種プロファイルにある「5.6枚持ちメダル/5.6枚現金」の別データは
  見つからなかったため未実装)。
  周期・規定コレ数ごとの期待値テーブルは調査した範囲(flick7.net,
  slot-toolbox.com, nana-press.com, chonborista.com, 1geki.jp, slobase.jp)
  では見つからず、reset_likely・current_cycle・current_korre_count軸は
  参考表示専用(判定には未反映)。実戦ログが十分に貯まったら、
  光さん自身のデータで検証・補正すること。

