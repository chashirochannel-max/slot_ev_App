# スマスロ 化物語 機種プロファイル
#
# 【機種情報】
# サミー(銀座)製、2025年12月8日導入のスマスロAT機(2026年9月14日時点で導入から
# 約9ヶ月、現役稼働中)。
# AT初当り1/265.1(設定1)〜1/219.6(設定6)、出玉率97.9%〜112.1%、
# 通常時ベース約31.1G/50枚、純増:倖時間約2.7枚/G・超倖時間約5.0枚/G。
#
# 【天井システム(周期・モード概念なし、ゲーム数天井のみのシンプル構成)】
# world_dystar.yaml・sao2.yamlと同型の「単一ゲーム数カウンター+設定変更後に
# 天井短縮」パターン。
#   - 通常時: (超)夢の時間ヲ終わラセルな終了後1000G消化でAT+倍倍チャンス当選。
#   - 設定変更後: 天井が600Gに短縮(400G短縮)。恩恵は通常時と同じAT+倍倍チャンス。
#   - 電源OFF/ONでも天井ゲーム数は引き継ぎ(据え置き挙動)。
# 出典サイトの期待値表は「設定変更後0G＝通常400Gとして同じ行で確認できる」と
# 明記した上で、通常時G数と設定変更後G数を1つの表に並記する形式になっている
# (つまり出典サイト自身が、通常テーブルを400Gオフセットしたものが設定変更後
# テーブルであることを保証している。karakuri_circus2.yamlのlcd_reset/lcd_normal
# の700Gオフセットと同じ関係で、本プロファイルではこの1本の表をnormal/resetの
# 2テーブルに分割して転記しただけであり、独自の補間・推測は行っていない)。
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slot-toolbox.com「スマスロ 化物語 天井期待値・狙い目・
# やめどきまとめ」の「💰 天井期待値・狙い目ライン」セクションに掲載されている
# 期待値表を転記したもの。WebFetchのAI要約は使わず、
#   curl -s -A "Mozilla/5.0 ..." https://slot-toolbox.com/bakemonogatari-tenjo/
# で生HTMLを取得し、Pythonでタグを除去したテキストをRead toolで直接目視確認して
# 転記している(過去にWebFetch要約が数値をハルシネートした実例があるため)。
# 抽出に使ったスクリプト・中間テキストファイル:
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\bakemonogatari.html (生HTML)
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\bakemonogatari_text.txt (抽出テキスト)
# 出典: https://slot-toolbox.com/bakemonogatari-tenjo/ (2026年9月14日取得)
#
# 【期待値表の前提条件(出典ページ本文より引用)】
# 「設定1・AT初当り1/265.1・通常時約31.1G/50枚・出玉率97.9%を基準にしています。
# 通常状態は1000G天井、設定変更後は600G天井として、同じ平均回収条件を使用して
# います。AT後3Gの引き戻し確認に加え、学習塾ステージ抜けまでの追加確認を平均20G、
# AT後合計23Gとして計算しています。解呪連・HIGH・怪異の煽り文字は、示唆や前兆が
# 否定されるまで取り切る前提です。天井到達時の倍倍チャンスは、天井到達率に応じて
# 反映しています。100G・200G・300GのCZ抽選によるゲーム数ごとの偏り、設定変更後
# 51〜100GのHIGH固有価値、AT獲得枚数の引き継ぎ、閉店欠損は個別に加算していません。」
#
# 【リセット恩恵の強さ(転記した実データから導かれるプラス転換ゲーム数)】
# 通常時(天井1000G):
#   等価      … 300G(-72円)→400G(+258円)の間でプラス転換
#   5.6枚持ち … 300G(-64円)→400G(+230円)の間でプラス転換
#   5.6枚現金 … 500G(-213円)→600G(+468円)の間でプラス転換
# 設定変更後(天井600G):
#   等価      … 0G時点で既に+258円(通常400G相当のプラス値を初手から引き継ぐ)
#   5.6枚持ち … 0G時点で既に+230円
#   5.6枚現金 … 0G(-683円)→100G(-213円)→200G(+468円)の間でプラス転換
# つまり設定変更後は「400G分のヘッドスタート」を得る形になり、5.6枚現金でも
# 通常時なら500〜600Gかかるプラス転換が100〜200Gまで前倒しされる。
# なお出典サイトが提示する「狙い目」ライン(通常時 等価480G/持ち490G/現金610G前後、
# 設定変更後 等価80G/持ち90G/現金210G前後)は、上記のEV=0地点そのものではなく、
# 「時給1,000円以上となる最初のゲーム数」というより保守的な基準で算出されたもの
# (出典ページに明記)。本プロファイルのrulesはEV=0基準(±200円バッファ)で判定
# しており、出典の「狙い目」ラインより早い段階で「様子見」〜「続行推奨」に
# 転じる場合がある点に注意。
#
# 【モード・周期概念について】
# 本機に解呪連・HIGH・怪異の煽り文字といった状態要素はあるが、モンキーターンVや
# からくりサーカス2のような「テーブル行としての周期・モード区切り」は無く、
# 出典サイトの期待値表も単一のゲーム数天井カウンターに対する集計値(モードを
# 区別しないブレンド値)。100G/200G/300G到達時のCZ当選率(設定1で20.0%/10.0%/
# 40.0%、設定6で20.0%/20.0%/50.0%)が出典に掲載されているが、これはAT間天井とは
# 別枠のCZ抽選機会であり、EV表の非単調な変化を生む「状態境界」には該当しない
# (単調増加のテーブルであることを確認済み)。そのためev_policy_noteに「非単調」
# 注記は付けていない。

id: bakemonogatari
name: "スマスロ 化物語"
summary: "AT間天井(通常1000G/設定変更後600G)のみのシンプルな単一カウンター制。周期・モード区切りなし。設定変更後は天井が400G短縮されるだけでなく、期待値テーブルも400Gオフセットでそのまま高い値にスライドする(出典が「設定変更後0G＝通常400G」と明記)。"
ev_policy_note: >
  AT後は(超)夢の時間ヲ終わラセルな終了後3Gの引き戻しを確認したうえで、学習塾
  ステージ抜けまで(平均20G、AT後合計23G)は継続する前提の期待値です(出典サイトの
  算出条件)。解呪連示唆・HIGH・怪異の煽り文字が残っている間は、示唆や前兆が
  否定されるまで取り切る前提も含まれています。一方、100G・200G・300G到達時の
  CZ抽選によるゲーム数ごとの偏り、設定変更後51〜100GのHIGH固有価値、AT獲得枚数の
  引き継ぎ、閉店による欠損は金額に反映されていません。これらの状況が確認できた
  場合は、表の数値より有利・不利にブレる可能性があります。
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/bakemonogatari.jpg")

axes:
  - key: current_game_count
    label: "現在のゲーム数((超)夢の時間ヲ終わラセルな終了後からのAT間天井カウンター。マイスロの「現在のゲーム数」で確認。設定変更後は天井600Gとして短縮されたそのままのカウントを入力)"
    type: integer
    default: 0

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か(天井が1000G→600Gに短縮される)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # この機種にcycleの概念はない(ゲーム数天井のみの1系統構成)。tables側の各行は
  # cycle列を全行1で埋めており、そこと一致させるための定数。これによりengineの
  # 2次元(cycle×game_count)ルックアップ機構をそのまま1次元テーブルとして流用
  # できる(world_dystar.yaml・toaru_index2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

# 期待値テーブル参照の設定。reset_likelyでnormal/resetのどちらの表を見るか、
# exchange_rateでどのレート区分を見るかを決め、dummy_cycle(常に1で完全一致)と
# current_game_count(前後の行を線形補間)で該当する期待値(円)を引く。
ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・AT間天井基準)"
    table_true_label: "設定変更後(600G天井)"
    table_false_label: "通常時(1000G天井)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1(最低設定)を仮定した攻略サイト(slot-toolbox.com)の算出値
  であり、実際の設定・実戦データによる補正ではない。通常時(1000G天井)・設定変更後
  (600G天井)とも同一の単一ゲーム数カウンターに対する集計値で、出典サイトが
  「設定変更後0G＝通常400Gとして同じ行で確認できる」と明記しているため、本
  プロファイルのresetテーブルは通常テーブルの400Gオフセット部分(通常400G〜950G)を
  そのまま転記したものであり、補間・推測による値ではない。

  通常テーブルは0〜950Gまで(天井1000Gの50G手前まで)、resetテーブルは0〜550Gまで
  (天井600Gの50G手前まで)のデータしかなく、それぞれ天井到達直前の数値は出典に
  掲載されていない。天井到達直前・直後のゲーム数を入力した場合、engineの仕様上
  テーブル最終行を超える入力はNone(データ範囲外)として様子見扱いになる。

  出典サイトが提示する「狙い目」ライン(通常時 等価480G/持ち490G/現金610G前後、
  設定変更後 等価80G/持ち90G/現金210G前後)は、EV=0地点ではなく「時給1,000円以上
  となる最初のゲーム数」という出典独自の保守的な基準で算出されている。本
  プロファイルのrulesはEV=0基準(±200円バッファ)で判定しているため、出典の
  「狙い目」ラインより早い段階で「様子見」または「続行推奨」と表示することがある。
  この差は数値の誤りではなく判定基準の違いであることに留意すること。

  解呪連・HIGH・怪異の煽り文字といった状態要素はあるが、期待値テーブル自体は
  モードを区別しないブレンド値であり、モンキーターンVやからくりサーカス2の
  ような「周期・モードの境界をまたぐ非単調(ノコギリ型)なEV変化」は確認されて
  いない(転記した全テーブルが単調増加であることを確認済み)。100G/200G/300G
  到達時のCZ当選率(設定1で20.0%/10.0%/40.0%、設定6で20.0%/20.0%/50.0%)は
  出典に掲載されているが、AT間天井の期待値テーブルとは別枠の情報のため、
  ev_lookupsには反映せずこのnotesへの記載に留める。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

