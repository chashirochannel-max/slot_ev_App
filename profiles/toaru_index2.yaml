# スマスロ とある魔術の禁書目録2 機種プロファイル
#
# 【重要な注意】
# 2026年8月3日導入のごく新しい機種であり、モンキーターンVに比べて解析データの
# 蓄積・検証が薄い(まだ実戦で十分に裏取りされていない可能性がある)。
#
# この機種は「実ゲーム数(AT間天井、最大1200G)」と「液晶ゲーム数(CZ間天井、
# 最大800G+α)」という2つの独立したゲーム数カウンターを持つ、モンキーターンVとは
# 全く別方式の天井システム。両方とも画面上で直接観測できるため、両カウンターの
# 期待値をそれぞれテーブル参照し、高い方(ev_real_yen/ev_lcd_yenのmax)を判定に
# 採用する。UI上は両方の数値を並べて表示し、どちらか一方に丸めて隠さない。
#
# 期待値データの前提: 設定1、通常時約30.8G/50枚、AT純増約4.0枚/G
# 出典: https://slot-toolbox.com/toaru-index2-tenjo/

id: toaru_index2
name: "スマスロ とある魔術の禁書目録2"
summary: "実ゲーム数(AT間天井1200G)と液晶ゲーム数(CZ間天井800G+α)の2カウンター制。導入間もなく解析データは薄め。"
ev_policy_note: >
  実ゲーム数・液晶ゲーム数どちらも天井(AT間1200G/CZ間800G+α)到達または自然
  当選まで打ち続け、AT終了後は追加で粘らずヤメることを前提にした期待値です
  (出典サイトの算出条件「AT終了後即ヤメ」)。小萌先生のお知らせ演出・
  ラストオーダー・アイキャッチ等のモード示唆による上振れは、出典サイトが
  「期待値表の金額へ加算していない」と明記しているため反映されていません。
  これらの示唆がある場合は表の数値より有利と見てよい、とされています。
header_image: "assets/badges_mascot/toaru_index2.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在の実ゲーム数(AT間天井カウンター・最大1200G)"
    type: integer
    default: 0

  - key: lcd_game_count
    label: "現在の液晶ゲーム数(CZ間天井カウンター・最大800G+α)"
    type: integer
    default: 0

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

  - key: reset_likely
    label: "設定変更(リセット・朝イチ専用モード)が濃厚か"
    type: boolean
    default: false
    # 実ゲーム数(AT間天井)側のみ、リセット時専用テーブル(real_at_reset)を参照する。
    # 出典はnana-press.com単一ソースで、うちの既存出典(slot-toolbox.com)とは
    # 通常時テーブル同士で最大190円前後の食い違いがあり、裏取りが完了していない
    # 参考値(2026-09-18調査、notes参照)。液晶ゲーム数(CZ間天井)側はリセット後の
    # 円換算データが一切見つかっていないため、reset_likelyの影響を受けない
    # (常にlcd_czテーブルを参照する)。

derived:
  # tables.real_at / tables.lcd_czという単一グループしか使わないが、
  # ev_lookupsの仕組み上table_select_axis(boolean)が必須なので、常にtrueを
  # 返す定数を割り当てて固定している。
  - key: always_main
    expr: "True"

  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数。これによりengineの2次元(cycle×game_count)
  # ルックアップ機構をそのまま1次元テーブルとして流用できる。
  - key: dummy_cycle
    expr: "1"

# 2系統の天井カウンターをそれぞれ独立にテーブル参照する。
ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: real_at_reset
    table_select_false: real_at
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_real_yen
    label: "期待値(実ゲーム数基準・AT間天井)"
    table_true_label: "設定変更後(単一ソース・未検証の参考値)"
    table_false_label: "通常時(据え置き)"

  - table_select_axis: always_main
    table_select_true: lcd_cz
    table_select_false: lcd_cz
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: lcd_game_count
    result_key: ev_lcd_yen
    label: "期待値(液晶ゲーム数基準・CZ間天井)"

rules:
  - id: ev_missing
    condition: "ev_real_yen == None or ev_lcd_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 2系統のうち高い方(max)を採用して判定する。
  - id: ev_go
    condition: "ev_real_yen != None and ev_lcd_yen != None and max(ev_real_yen, ev_lcd_yen) > 200"
    result: "続行推奨"
    reason: "実ゲーム数・液晶ゲーム数のうち高い方の期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_real_yen != None and ev_lcd_yen != None and max(ev_real_yen, ev_lcd_yen) >= -200"
    result: "様子見"
    reason: "実ゲーム数・液晶ゲーム数どちらの期待値(設定1想定)も収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "実ゲーム数・液晶ゲーム数どちらの期待値(設定1想定)もマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年8月導入の新台のため解析データがまだ薄い。実ゲーム数基準(AT間天井1200G)・
  液晶ゲーム数基準(CZ間天井800G+α)の両方の期待値テーブルを使用し、高い方を判定に
  採用している。実戦ログが貯まったら、光さん自身のデータで検証・補正すること。

  【2026年9月、機種プロファイル監査時の再確認(設定変更後テーブルの有無について)】
  出典サイト(slot-toolbox.com)を再取得し確認した結果、設定変更後(朝イチ専用
  モード、CZ間天井200G+α/AT間天井777Gへ短縮)については期待値の円換算テーブルを
  公表していないことを確認した。本文・FAQとも「設定変更後は0G時点の評価を交換
  条件別に示し、期待値金額と細かな狙い目G数は掲載していません」と明記されており、
  実際に示されているのは「0G時点で等価・5.6枚持ちはプラス圏、5.6枚現金は
  マイナス圏」という交換条件別の定性評価のみで、複数G地点にわたる円額系列
  データではない。したがって本プロファイルが設定変更後専用のev_lookupsテーブル
  を持たないのは記載漏れではなく、転記できる一次数値が存在しないための仕様。
  将来、出典サイトが数値テーブルを追加した場合、または光さん自身の実戦ログが
  貯まった場合に追加を検討すること。

  【同監査時に確認した内部モード別CZ間天井・移行振り分け(参考情報・期待値円額
  には未反映)】
  出典サイトの「内部モードとCZ間天井」表によれば、通常時のCZ間天井はモードにより
  異なる: 通常A=800G+α(消化後30%以上で通常B以上へ)、通常B=700G+α(消化後約50%
  で天国準備以上へ)、天国準備=800G+α(150G+αの天井振り分けあり、消化後約50%で
  天国へ)、天国=100G+α(100G+αまでにCZ以上当選濃厚、約25%で天国ループ・約20%
  で天国準備・約55%で通常Aまたは通常Bへ)、朝イチ(設定変更時専用)=200G+α。
  本プロファイルのlcd_czテーブルはこれらのモードを区別しない集計値であり、出典
  サイト自身も「通常状態の期待値表はモード別ゾーンや次回モードの追加価値を
  金額へ反映していません」と明記している。そのため、小萌先生お知らせ・
  ラストオーダーお知らせ・ステージチェンジ時アイキャッチ等のモード示唆から
  天国・天国準備などの有利モード濃厚と判断できる場合、実際の期待値はlcd_cz
  テーブルの数値より高い可能性がある(円額としては出典サイトも未算出のため、
  本プロファイルのev_lcd_yenには反映せず参考情報にとどめる)。

  【2026年9月18日、光さんの「朝イチのリセット(設定変更)狙い」プレイスタイルに
  合わせた再調査(リセット後の円換算期待値テーブルの有無)】
  1. 出典サイト(slot-toolbox.com)を再取得した(最終更新日2026年9月16日、複数回の
     更新履歴あり)。リセット後(朝イチ専用モード)の円換算テーブルは依然として
     非公開で、「設定変更後は0G時点の評価を交換条件別に示し、期待値金額と細かな
     狙い目G数は掲載していません」という記載に変化はなかった。
  2. 他サイトを広く調査した(altema.jp=アクセス制限403で本文確認不可、1geki.jp=
     天井ゲーム数の記載のみで円換算表なし、chonborista.com=天井期待値を画像
     グラフでのみ掲載し数値抽出不可、rakupachi.com=アクセス制限429で本文確認
     不可、p-town.dmm.com=「約2000円/時」等の概算記述のみ、amuse-p.com=期待値
     「調査中」、slopachi-quest.com=天井期待値「現在調査中」)。この中で唯一、
     nana-press.com「天井の期待値や恩恵・狙い目とヤメ時まとめ」
     (https://nana-press.com/kaiseki/machine/1154/38015/、最終更新日2026年9月7日)
     に、AT間天井(実ゲーム数)側の通常時テーブルとリセット時(設定変更後)テーブル
     の両方が円換算(0〜700G、50G刻み、等価/5.6枚の2区分)で掲載されていた。算出
     条件は「設定1、AT終了後即ヤメ、30.8G/50枚のコイン持ち、純増4.0枚/G固定」と
     明記されており、文言上は本プロファイルの前提と一致する。
  3. ただし本プロファイルのtables/ev_lookupsへの採用は見送った。理由は2点:
     (a) このnana-press.comの表と一致する数値を示す第2の独立サイトが見つから
         なかった。lcd_cz側のリセットテーブルに至っては、円換算数値を掲載する
         サイトがnana-press.comを含め1件も見つからなかった。
     (b) 比較のため、nana-press.comの「通常時」テーブルを本プロファイル既存の
         real_at等価テーブル(出典:slot-toolbox.com、両サイトとも同一の算出条件を
         明記)と突き合わせたところ、0G:-670円(nana-press)対-695円(既存)、
         200G:-185円対-286円、300G:158円対14円、400G:593円対403円、1100G:9358円
         対9350円など、300〜400G帯を中心に最大190円前後のズレがあった(差分が
         一定でなく400G付近をピークとする山型で、単純な丸め誤差とは考えにくい)。
         これは同一条件を掲げていても2サイトの内部計算モデルが完全一致しない
         ことを示しており、sao2.yaml(43〜55行目)で採用した「独立サイトの数値が
         完全一致した場合のみ採用」という基準に、今回のnana-press.comデータは
         届かなかった。実戦の資金判定に直結するテーブルを、単一かつ検証不能な
         食い違いのあるソースへ差し替えるリスクは、リセット判定機能が無いことの
         機会損失より大きいと判断した。
  4. 参考情報として、nana-press.comの実ゲーム数天井(AT間天井)側テーブルの生数値
     を将来の再検討用に記録しておく(単位:円、[ゲーム数, 金額]):
       通常時・等価: [0,-670][50,-569][100,-456][150,-329][200,-185][250,-24]
         [300,158][350,363][400,593][450,852][500,1144][550,1473][600,1843]
         [650,2260][700,2728][750,3256][800,3850][850,4519][900,5272][950,6120]
         [1000,7075][1050,8149][1100,9358][1150,10720]
       通常時・5.6枚: [0,-1982][50,-1882][100,-1769][150,-1641][200,-1498]
         [250,-1336][300,-1155][350,-950][400,-720][450,-460][500,-168][550,160]
         [600,530][650,947][700,1416][750,1943][800,2538][850,3207][900,3960]
         [950,4807][1000,5762][1050,6836][1100,8046][1150,9407]
       リセット時・等価: [0,-670][50,-300][100,107][150,557][200,1053][250,1600]
         [300,2204][350,2871][400,3607][450,4419][500,5316][550,6305][600,7397]
         [650,8601][700,9931]
       リセット時・5.6枚: [0,-1982][50,-1613][100,-1206][150,-756][200,-260]
         [250,287][300,892][350,1559][400,2295][450,3107][500,4003][550,4992]
         [600,6084][650,7289][700,8618]
     「5.6枚」列は出典側で持ちメダル/現金の区別が明記されていない(sao2.yamlの
     nana-press表と同様の制約であり、本プロファイル既存の5.6枚持ちメダル/
     5.6枚現金の3区分にそのまま当てはめることもできない)。
  5. 【2026年9月18日、光さんの最終判断】上記4の生数値を提示した上で「単一ソース・
     未検証と明記した上で取り込む」という判断を受け、`reset_likely`軸と
     `tables.real_at_reset`を追加した(実ゲーム数/AT間天井側のみ。液晶ゲーム数/
     CZ間天井側は0ソースのため見送ったまま)。5.6枚は出典が持ちメダル/現金を
     区別していないため、より保守的な解釈として「5.6枚現金」列にのみ転記し、
     「5.6枚持ちメダル」は空欄(未入力)のまま残した(選択時はエンジンが
     「データがありません」と表示し、None値として様子見判定に倒れる)。
     `ev_lookups`の`table_true_label`に「単一ソース・未検証の参考値」と明記し、
     結果画面でも通常時テーブルと区別がつくようにしてある。
     次回、2サイト以上での数値一致確認、または光さん自身のリセット実戦ログが
     貯まった場合に、この暫定テーブルを補正・格上げすること。

