# スマスロ とある魔術の禁書目録2 機種プロファイル
#
# 【重要な注意】
# 2026年8月3日導入のごく新しい機種であり、モンキーターンVに比べて解析データの
# 蓄積・検証が薄い(まだ実戦で十分に裏取りされていない可能性がある)。
#
# この機種は「実ゲーム数(AT間天井、最大1200G)」と「液晶ゲーム数(CZ間天井、
# 最大800G+α)」という2つの独立したゲーム数カウンターを持つ、モンキーターンVとは
# 全く別方式の天井システム。両方とも画面上で直接観測できるため、両カウンターの
# 期待値をそれぞれテーブル参照し、高い方(ev_real_yen/ev_lcd_yenのmax)を判定に
# 採用する。UI上は両方の数値を並べて表示し、どちらか一方に丸めて隠さない。
#
# 期待値データの前提: 設定1、通常時約30.8G/50枚、AT純増約4.0枚/G
# 出典: https://slot-toolbox.com/toaru-index2-tenjo/

id: toaru_index2
name: "スマスロ とある魔術の禁書目録2"
summary: "実ゲーム数(AT間天井1200G)と液晶ゲーム数(CZ間天井800G+α)の2カウンター制。導入間もなく解析データは薄め。"
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/toaru_index2.jpg")

axes:
  - key: current_game_count
    label: "現在の実ゲーム数(AT間天井カウンター・最大1200G)"
    type: integer
    default: 0

  - key: lcd_game_count
    label: "現在の液晶ゲーム数(CZ間天井カウンター・最大800G+α)"
    type: integer
    default: 0

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "等価"

derived:
  # tables.real_at / tables.lcd_czという単一グループしか使わないが、
  # ev_lookupsの仕組み上table_select_axis(boolean)が必須なので、常にtrueを
  # 返す定数を割り当てて固定している。
  - key: always_main
    expr: "True"

  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数。これによりengineの2次元(cycle×game_count)
  # ルックアップ機構をそのまま1次元テーブルとして流用できる。
  - key: dummy_cycle
    expr: "1"

# 2系統の天井カウンターをそれぞれ独立にテーブル参照する。
ev_lookups:
  - table_select_axis: always_main
    table_select_true: real_at
    table_select_false: real_at
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_real_yen
    label: "期待値(実ゲーム数基準・AT間天井)"

  - table_select_axis: always_main
    table_select_true: lcd_cz
    table_select_false: lcd_cz
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: lcd_game_count
    result_key: ev_lcd_yen
    label: "期待値(液晶ゲーム数基準・CZ間天井)"

rules:
  - id: ev_missing
    condition: "ev_real_yen == None or ev_lcd_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 2系統のうち高い方(max)を採用して判定する。
  - id: ev_go
    condition: "ev_real_yen != None and ev_lcd_yen != None and max(ev_real_yen, ev_lcd_yen) > 200"
    result: "続行推奨"
    reason: "実ゲーム数・液晶ゲーム数のうち高い方の期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_real_yen != None and ev_lcd_yen != None and max(ev_real_yen, ev_lcd_yen) >= -200"
    result: "様子見"
    reason: "実ゲーム数・液晶ゲーム数どちらの期待値(設定1想定)も収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "実ゲーム数・液晶ゲーム数どちらの期待値(設定1想定)もマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年8月導入の新台のため解析データがまだ薄い。実ゲーム数基準(AT間天井1200G)・
  液晶ゲーム数基準(CZ間天井800G+α)の両方の期待値テーブルを使用し、高い方を判定に
  採用している。実戦ログが貯まったら、光さん自身のデータで検証・補正すること。

