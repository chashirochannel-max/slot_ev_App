# スマスロ とある魔術の禁書目録2 機種プロファイル
#
# 【重要な注意】
# 2026年8月3日導入のごく新しい機種であり、モンキーターンVに比べて解析データの
# 蓄積・検証が薄い(まだ実戦で十分に裏取りされていない可能性がある)。
#
# この機種は「実ゲーム数(AT間天井、最大1200G)」と「液晶ゲーム数(CZ間天井、
# 最大800G+α)」という2つの独立したゲーム数カウンターを持つ、モンキーターンVとは
# 全く別方式の天井システム。v1では、より基本的な「実ゲーム数基準(AT間天井)」の
# 期待値テーブルのみを使用する。液晶ゲーム数(CZ間天井)側は、2つのカウンターの
# 相互作用の理解が今のところ確度を持てないため、v1では未実装。
#
# 期待値データの前提: 設定1、通常時約30.8G/50枚、AT純増約4.0枚/G
# 出典: https://slot-toolbox.com/toaru-index2-tenjo/

id: toaru_index2
name: "スマスロ とある魔術の禁書目録2"
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/toaru_index2.jpg")

axes:
  - key: current_game_count
    label: "現在の実ゲーム数(AT間天井カウンター)"
    type: number
    default: 0

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "等価"

derived:
  # この機種は「据え置き/リセット」のような2状態を持つテーブルがまだ無く、
  # tables.mainという単一グループしか使わない。ev_lookupの仕組みは
  # table_select_axis(boolean)でテーブル群を選ぶ設計だが、選ぶ対象が1つしか
  # ないので、常にtrueを返す定数を割り当てて単一グループに固定している。
  - key: always_main
    expr: "True"

  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数。これによりengineの2次元(cycle×game_count)
  # ルックアップ機構をそのまま1次元テーブルとして流用できる。
  - key: dummy_cycle
    expr: "1"

ev_lookup:
  table_select_axis: always_main
  table_select_true: main
  table_select_false: main
  rate_axis: exchange_rate
  cycle_axis: dummy_cycle
  game_count_axis: current_game_count
  result_key: ev_yen

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定・実ゲーム数基準)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定・実ゲーム数基準)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定・実ゲーム数基準)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年8月導入の新台のため解析データがまだ薄い。実ゲーム数基準(AT間天井1200G)の
  期待値のみを使用しており、液晶ゲーム数基準(CZ間天井800G+α)側は未反映。
  実戦ログが貯まったら、光さん自身のデータで検証・補正すること。

