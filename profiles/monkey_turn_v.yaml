# スマスロ モンキーターンV 機種プロファイル
#
# 【この期待値データについて(重要)】
# 判定は「開始ゲーム数 × 周期数」の組み合わせごとに算出された期待値(円)テーブル
# (tables以下)を参照して行う。このテーブルはflick7.net「スマスロ モンキーターン
# V 天井狙い完全攻略」で公開されている期待値表を転記したもので、以下の前提に
# 基づく攻略サイト側の算出値である(公式一次情報ではない)。
#   - 設定1(最低設定)ベース。光さんの「平日は基本的に低設定運用のホールを想定」
#     という前提に合わせ、保守的な数値になるようv1では設定1に固定している
#   - 前兆32G、回転数750G/時間、純増2.5枚/G、周期ごとの平均G数(1周期目:約80G、
#     2〜5周期目:各約150G、6周期目:約115G)という仮定に基づく計算値
#   - ライバルモード等の特殊要素による上振れは、この期待値には含まれていない
#     (rival_mode軸はあくまで参考表示用で、期待値の計算には使っていない)
# 実戦ログが十分に貯まったら、光さん自身のデータで検証・補正すること。
# 出典: https://flick7.net/slot/monkeyturn5__c.php

id: monkey_turn_v
name: "スマスロ モンキーターンV"
summary: "1〜6周期のポイント制。設定変更後は最大4周期に短縮。ライバルモード中は早めにボーダー到達の傾向(期待値には未反映)。"
header_image: "assets/badges_mascot/monkey_turn_v.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)
ev_policy_note: >
  外れても次の周期へ進み、天井(通常6周期/設定変更後4周期)到達または自然当選
  まで打ち続けることを前提にした期待値です(出典サイトの算出条件「AT終了後
  即やめ」=AT終了後に粘って連続狙いはしない、という前提のみで、1周期目で
  外れたら即ヤメといった早期リタイア前提ではありません)。ライバルモード等の
  実戦上の示唆による上振れは金額に反映されていません。
  注意:周期が進むほど単調に期待値が上がるわけではありません。天国モードは
  1周期目でほぼ確定当選のため、2周期目に入った直後は「天国ではなかった」
  ことが確定した直後で最も期待値が下がり、通常Bは3周期目でほぼ確定当選の
  ため3周期目の入口でも同様の下がり方をします。周期の変わり目付近で数字が
  一時的に下がるのは異常ではなく、この機種の仕様です。

axes:
  - key: counter_visible
    label: "周期カウンター表示が出ているか"
    type: boolean
    default: true
    # AT終了直後・朝イチ数ゲームは表示が出ないため、falseの場合は判定を保留する

  - key: current_cycle
    label: "現在の周期数"
    type: integer
    default: 1

  - key: current_game_count
    label: "現在の消化ゲーム数(本日の表示G数)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。画面表示から直接観測する値で、据え置きでも
    # 前日分を別途加算する必要はない(current_cycleと同じ理由)。

  - key: current_point
    label: "現在の激走ポイント(任意・参考表示のみ)"
    type: integer
    optional: true
    # 判定(期待値テーブル参照)には使わない。結果画面での参考表示専用。

  - key: rival_mode
    label: "ライバルモード滞在中か(参考表示。期待値の計算には未反映)"
    type: boolean
    default: false

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か"
    type: boolean
    default: true
    # 期待値テーブルのどちらの表(据え置き用/リセット用)を参照するかを決める。

  - key: carryover_prev_cycle
    label: "前日の最終周期数(据え置き時のみ・整合性チェック用)"
    type: integer
    optional: true
    condition: "not reset_likely"
    # 判定には使わない。「据え置きのはずなのに現在の周期数が前日より少ない」
    # という矛盾を検知するための整合性チェック専用の入力。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。
    # 期待値テーブル(tables)のどのレート区分を参照するかを選ぶ。

derived:
  # 据え置き前提なのに現在周期数が前日最終周期数を下回っている場合、
  # 実は途中でリセットされたか、他のプレイヤーがAT当選した可能性がある。
  - key: carryover_mismatch
    expr: "(not reset_likely) and defined(carryover_prev_cycle) and (current_cycle < carryover_prev_cycle)"

# 期待値テーブル参照の設定。reset_likelyでnormal/resetのどちらの表を見るか、
# exchange_rateでどのレート区分を見るかを決め、current_cycle(完全一致)と
# current_game_count(前後の行を線形補間)で該当する期待値(円)を引く。
# 結果はev_yenという名前でderived/rulesから参照できるようになる。
ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: reset
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: current_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定)"
    table_true_label: "設定変更後"
    table_false_label: "通常時(据え置き)"

rules:
  - id: counter_not_visible
    condition: "not counter_visible"
    result: "様子見"
    reason: "周期カウンター表示がまだ出ていません。数ゲーム消化して表示が出てから再確認してください。"

  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力された周期数・ゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値はすべて設定1(最低設定)を仮定した攻略サイト(flick7.net)の算出値であり、
  実際の設定・実戦データによる補正ではない。ライバルモード・EXアイテム等の
  特殊要素による上振れも反映されていない。実戦ログが十分に貯まった段階で、
  光さん自身のデータと突き合わせて閾値やテーブル自体を補正すること。

  【2026年9月、光さんからの指摘を受けて再検証(やめ時の前提について)】
  「この期待値は天井まで打ち切った前提か、1周期目で外れたら即ヤメといった
  条件が混ざっていないか」という指摘を受け、flick7.netのページを再取得し
  算出条件を確認した。この期待値表(「ゾーン・天井期待値」)は以下の条件で
  算出されている(原文の算出条件リストより):
    前兆32G / 回転数[32G/50枚][750G/時間] / 純増[2.5枚/G] /
    周期ごとの平均G数(1周期目:約80G、2〜5周期目:各約150G、6周期目:約115G) /
    モード振り分けは解析値・仮定値を使用 / AT終了後即やめ
  「周期ごとの平均G数」が2〜6周期目まで明記されていることから、この表は
  「外れても次の周期へ進み、天井(6周期、設定変更後4周期)到達または自然当選
  まで打ち続けた場合」の期待値であり、1周期目で外れたら即ヤメという前提には
  なっていない。「AT終了後即やめ」は、AT終了後に別の理由なく粘り続けない
  (連続狙いをしない)という前提を指す。
  なお、ページ本文の「狙い目とやめ時」節には「(ライバルモードでなければ)
  4周期目か5周期目以降からの狙いが望ましい」という要約的な記載があるが、
  これは「5周期目以降は周期内のG数を問わず常にプラス」という粗い目安であり、
  本プロファイルが使う詳細テーブル(1〜4周期目はG数次第でプラスに転じる)とは
  矛盾しない(精度の違いであり、数値自体は同じ表から来ている)。

  【2026年9月、光さんからの指摘を受けて再検証(設定1でほぼ常にプラスになる
  ことの整合性について)】
  「1周期目G33以上でプラスなら、ほぼどこから打ち始めてもプラスになり、
  設定1でもお店が損をすることになるのでは」という指摘を受け、flick7.netの
  設定1の基本スペック(同ページ内の別表)を確認した:
    設定1: AT初当り 1/299.8、機械割 97.9%、平均獲得 438.5枚
  設定1の全体平均機械割は97.9%(店側が2.1%勝つ)で変わらず、矛盾していない。
  理由は「条件付き期待値」と「無条件の平均」は別物だから:
    - 97.9%は「G0から何も見ずに打ち始めた場合」を含む全体平均。この状態の
      期待値は表でも-598円と明確にマイナスで、来店客の大多数はここに該当する。
    - G33以上でプラスというのは「すでにG33まで進んだ状態を観測した後」の
      条件付き期待値。天井(666pt/6周期)という必ず当たるゴールが決まっている
      ため、ゴールに近づくほど残りの投資コストが減り、条件付き期待値が
      ゼロを超えるのは数学的に自然な現象(天井狙い攻略サイト業界全体の前提
      そのものであり、本機だけの特殊な話ではない)。
    - プラスの区間を確保できる客数は限られる(1台に同時に座れるのは1人)ため、
      大多数がG0スタートの母数である店全体の収支は97.9%通りマイナスに収まる。
  つまり「ほぼどこから打ってもプラス」ではなく「無条件の平均はマイナス、
  条件を知って狙った場合のみ一部の区間がプラス」という、通常の天井狙いの
  前提と一致する。

