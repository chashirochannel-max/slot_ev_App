# スマスロ からくりサーカス2 機種プロファイル
#
# 【この機種の天井システムについて】
# 2026年7月導入。天井カウンターは独立した3系統を持つ複合型:
#   1. 液晶ゲーム数天井(CZ間) … 通常時は最深1200G(確認できたデータは1150Gまで)、
#      設定変更が濃厚な場合は500Gに短縮される。到達でCZ「機械仕掛けの女神」当選。
#   2. 女神間実ゲーム数890G天井(CZ間) … 1.とは別カウンターの実ゲーム数で、
#      890G消化でも同じくCZ「機械仕掛けの女神」に当選する。設定変更による短縮は
#      無い(1.の液晶ゲーム数天井のみが短縮対象、と複数ソースで明記)。
#   3. AT間実ゲーム数2500G天井 … 2500G消化でAT直撃+成功濃厚の激情ジャッジ。
#      設定変更による短縮の記載なし。
# さらに「CZ「機械仕掛けの女神」を4連続で外した場合、5回目のCZがAT当選に
# 書き換わる」という女神スルー天井も存在する。2026年9月13日の再調査で、出典
# ページに「女神スルー天井の期待値」という参考期待値表(2/3/4スルー×女神間
# 実G数、等価交換のみ)が新たに公開されていることを確認したため、下記の通り
# goddess_through_count軸+ev_goddess_through_reference_yenとして追加した
# (ただし続行推奨/様子見/見送りの判定には使わず、参考表示専用)。
#
# 3系統(液晶/女神間/AT間)は同時並行で進行し、どれか1つが天井に到達すればよい
# という関係にある。toaru_index2.yaml(実ゲーム数天井とCZ間天井の2系統を
# max()で合成する設計)と同じ考え方を3系統に拡張し、rules側で3つのev_lookup
# 結果のうち最大値を採用する。
#
# 【期待値データについて(重要)】
# tables以下は https://slot-toolbox.com/karakuri-circus2-tenjo/ の期待値表を
# 転記したもの(設定1ベースと明記あり)。捏造でないことの検証として:
#   - 同ページを文言を変えて2回別々に取得し、両方で完全に同じ数値(円の位まで)
#     が得られることを確認した(例: 女神間890G・等価の全11点が一致)
#   - 液晶ゲーム数天井の表には「通常時700G以降の行は設定変更後は700引いた
#     ゲーム数と同じ期待値になる」という対応関係がページ内に明記されており、
#     これを用いて設定変更後(lcd_reset)テーブルを700オフセットで機械的に導出した
#     (計算による捏造ではなく、出典ページが明示した1:1対応を転記したもの)
#   - 各テーブルとも「ゲーム数が増えるほど期待値が単調増加」「5.6枚現金は常に
#     最も不利」という内部整合性をPythonスクリプトでアサーション済み
#   - 天井の数値(液晶1200G→設定変更後500G短縮、女神間890G、AT間2500G)は
#     slot-toolbox.com と chonborista.com の2ソースで一致することを確認した
# ただし以下の限界がある:
#   - 液晶ゲーム数天井・女神間890G天井とも、データの最大点(1150G / 850G)より
#     先のゲーム数は最終値でクランプされる(実際の天井ぴったりの値ではない)
#   - 女神スルー天井の参考期待値(goddess_through)は「等価」交換のみ出典に
#     記載があり、5.6枚持ちメダル/5.6枚現金の内訳は見つからなかった。この
#     テーブルはrules側で使わない参考値のため、5.6枚系レート選択時は単に
#     ev_goddess_through_reference_yenがNoneになり画面上「データなし」表示に
#     なるだけで、判定(続行推奨/様子見/見送り)には影響しない
#   - モンキーターンV・とあるインデックス2と同様、攻略サイトの算出値であり
#     公式一次情報ではない。実戦ログが貯まったら光さん自身のデータで補正すること
#
# 【2026年9月13日の再調査で追加確認した事項】
#   1. AT間2500G天井の5.6枚持ちメダル/5.6枚現金データが出典ページに追加
#      公開されていることを確認し、at_realテーブルに転記した(従来「等価」
#      のみだった欠落が解消。値は下記スクリプトで単調増加・現金最下位を
#      検証済み)。これに伴い、旧バージョンにあった「ev_at_yenがNoneの場合は
#      ev_lcd_yenで代用する」というrules側のワークアラウンドは不要になった
#      ため削除した(3テーブルとも全レートでデータが揃ったため)。
#   2. 女神スルー天井の参考期待値表(等価交換のみ)が出典ページに追加公開
#      されていたため、goddess_through_count軸とev_goddess_through_reference_yen
#      (result_key)を新設。l_sengoku_musume5.yamlのev_cycle_reference_yenと
#      同じ「別モデル・rulesでは絶対参照しない・参考表示専用」パターンを踏襲。
#   3. モード別の規定ゲーム数・移行率・液晶G数ゾーン別モード出現率の内訳表
#      (通常A〜D・天国の5モード)が出典ページに公開されていることを確認した。
#      液晶ゲーム数表はこの5モードを平均化したブレンド値であり、モード示唆が
#      出た場合は表より有利/不利に見るべきという注記があったため、notes欄に
#      転記した(CLAUDE.mdの「機種追加時の調査ガイドライン」に基づく対応。
#      ただし円換算のAT期待度テーブルではなく移行率%の表のため、新たな
#      ev_lookupsは追加せず、notesでの参考情報にとどめている)。
#   検証スクリプト:
#     C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#     a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\verify_karakuri_new_data.py
# 出典:
#   - https://slot-toolbox.com/karakuri-circus2-tenjo/ (期待値テーブル、天井G数、
#     2026年9月13日再取得でAT間5.6枚系・女神スルー参考期待値・モード内訳表を追加確認)
#   - https://chonborista.com/slot/sankyo-slot/256699/ (天井システムの裏取り、
#     設定変更時の液晶ゲーム数天井500G短縮の確認)
#   - https://nana-press.com/kaiseki/machine/1144/37427/ (設定1ベースである
#     ことの確認、500G短縮の再確認)

id: karakuri_circus2
name: "スマスロ からくりサーカス2"
summary: "液晶ゲーム数(CZ間天井1200G/設定変更後500G)・女神間実ゲーム数(890G)・AT間実ゲーム数(2500G)の3カウンター制。"
ev_policy_note: >
  液晶・女神間・AT間の3天井のいずれかへ到達、または自然当選まで打ち続け、
  AT終了後は追加で粘らずヤメることを前提にした期待値です(出典サイトの算出
  条件「AT終了後即ヤメ」)。幕間チャンス・液晶100Gゾーン・CZ/運命の一劇失敗後
  のPUSH演出・運命の一劇失敗後128G間の引き戻し(期待度5.1%)・モード示唆と
  いった実戦上の示唆は、出典サイトが金額へ加算していないため反映されていません。
  これらを確認できた場合は表の数値より有利と見てよい、とされています。
  女神スルー(CZを4連続で外すと5回目でAT直撃)については、女神スルー回数を
  入力すると「参考:女神スルー天井を狙う場合の期待値」が別枠で表示されますが、
  こちらは等価交換のみのデータで、かつ液晶・女神間・AT間の3天井の期待値とは
  合算できない別モデルのため、続行推奨/様子見/見送りの判定には反映されません。
  該当する状況を確認できた場合は、この参考値も踏まえて光さん自身で判断してください。
header_image: null  # assets/配下に画像を置いたらここにパスを書く(例: "assets/karakuri_circus2.jpg")

axes:
  - key: lcd_game_count
    label: "現在の液晶ゲーム数(CZ間天井カウンター・通常時最深1200G)"
    type: integer
    default: 0

  - key: real_game_count_goddess
    label: "現在の女神間実ゲーム数(CZ間天井カウンター・890Gで機械仕掛けの女神)"
    type: integer
    default: 0
    # 液晶ゲーム数天井(上のlcd_game_count)とは別カウンター。どちらか先に
    # 到達した方でCZ「機械仕掛けの女神」に当選する。

  - key: goddess_through_count
    label: "女神スルー回数(CZ「機械仕掛けの女神」を連続で外した回数。2〜4のみ参考期待値データあり)"
    type: integer
    default: 0
    optional: true
    # 4連続で外すと5回目のCZがAT当選+成功濃厚の激情ジャッジに書き換わる
    # 「女神スルー天井」用の軸。入力すると、上のreal_game_count_goddessと
    # 組み合わせて判定には使わない参考期待値(ev_goddess_through_reference_yen)
    # を追加計算する。出典に2/3/4スルーの行しかないため、0・1を入れても
    # (またはこの軸を未入力のままでも)Noneが返るだけで判定には影響しない。

  - key: real_game_count_at
    label: "現在のAT間実ゲーム数(AT間天井カウンター・2500GでAT直撃)"
    type: integer
    default: 0

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か"
    type: boolean
    default: false
    # trueの場合、液晶ゲーム数天井(lcd_game_count)のみ1200G→500Gに短縮された
    # 期待値テーブル(lcd_reset)を参照する。女神間890G・AT間2500Gは設定変更に
    # よる短縮の記載が出典になかったため、reset_likelyの影響を受けない。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # goddess_real/at_realのev_lookupsはreset_likelyの影響を受けない単一グループ
  # しか使わないが、engineの仕組み上table_select_axis(boolean)が必須なので、
  # 常にtrueを返す定数を割り当てて固定している(toaru_index2.yamlと同じ手法)。
  - key: always_main
    expr: "True"

  # この機種にcycleの概念はない。tables側の各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数(toaru_index2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

# 3系統の天井カウンターをそれぞれ独立にテーブル参照する。
ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: lcd_reset
    table_select_false: lcd_normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: lcd_game_count
    result_key: ev_lcd_yen
    label: "期待値(液晶ゲーム数基準・CZ間天井)"
    table_true_label: "設定変更後"
    table_false_label: "通常時"

  - table_select_axis: always_main
    table_select_true: goddess_real
    table_select_false: goddess_real
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: real_game_count_goddess
    result_key: ev_goddess_yen
    label: "期待値(女神間実ゲーム数基準・CZ間天井890G)"

  - table_select_axis: always_main
    table_select_true: at_real
    table_select_false: at_real
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: real_game_count_at
    result_key: ev_at_yen
    label: "期待値(AT間実ゲーム数基準・AT間天井2500G)"

  # 続行推奨/様子見/見送りの判定(rules)には一切使わない参考値。女神スルー
  # 天井(4連続外れで5回目AT濃厚)を狙う場合の補助期待値で、出典サイトも
  # メインの3テーブルへは足し算しないと明記している別モデル。goddess_through_count
  # を入力した場合のみ(2〜4スルー行しかないため、それ以外はNoneのまま)計算され、
  # 結果画面に参考metricとして並記される。l_sengoku_musume5.yamlの
  # ev_cycle_reference_yenと同じパターン。等価交換のみ出典にデータがあるため、
  # 5.6枚系レート選択時はNoneになる(rules側では絶対に参照しないこと)。
  - table_select_axis: always_main
    table_select_true: goddess_through
    table_select_false: goddess_through
    rate_axis: exchange_rate
    cycle_axis: goddess_through_count
    game_count_axis: real_game_count_goddess
    result_key: ev_goddess_through_reference_yen
    label: "参考:女神スルー天井を狙う場合の期待値(等価交換のみ・他3系統とは合算不可)"

rules:
  - id: ev_missing
    condition: "ev_lcd_yen == None or ev_goddess_yen == None or ev_at_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # 2026年9月13日の再調査でAT間2500G天井の5.6枚系データが出典に追加された
  # ため、旧バージョンにあった「ev_at_yenがNoneならev_lcd_yenで代用する」
  # ワークアラウンドは不要になり削除した(3系統とも全レートでデータが揃った)。
  - id: ev_go
    condition: "max(ev_lcd_yen, ev_goddess_yen, ev_at_yen) > 200"
    result: "続行推奨"
    reason: "液晶ゲーム数天井・女神間890G天井・AT間2500G天井のうち最も高い期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_watch
    condition: "max(ev_lcd_yen, ev_goddess_yen, ev_at_yen) >= -200"
    result: "様子見"
    reason: "液晶ゲーム数天井・女神間890G天井・AT間2500G天井のいずれの期待値(設定1想定)も収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "液晶ゲーム数天井・女神間890G天井・AT間2500G天井のいずれの期待値(設定1想定)もマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  2026年7月導入の新台。CZ「機械仕掛けの女神」に至る天井が液晶ゲーム数(通常1200G/
  設定変更後500G)と実ゲーム数890Gの2系統、AT直撃に至るAT間実ゲーム数天井が
  2500Gの、合計3系統の独立天井カウンターを持つ。期待値は
  https://slot-toolbox.com/karakuri-circus2-tenjo/ の設定1ベースの表を転記し、
  2回の別取得で数値が完全一致すること・単調増加であること・現金レートが常に
  最下位であることを検証済み。AT間2500G天井は当初「等価」交換のレートの期待値
  しか出典に無かったが、2026年9月13日の再調査で5.6枚持ちメダル/5.6枚現金の
  内訳が追加公開されていることを確認し、at_realテーブルへ転記した(3系統とも
  全レートでデータが揃ったため、旧バージョンにあった代用ロジックは削除)。

  また「CZを4連続で外すと5回目でAT当選+成功濃厚の激情ジャッジへ書き換わる」
  という女神スルー天井についても、同じ再調査で「女神スルー天井の期待値」という
  参考期待値表(2/3/4スルー×女神間実G数、等価交換のみ)が追加公開されている
  ことを確認したため、goddess_through_count軸とev_goddess_through_reference_yen
  として追加した。ただし出典サイトも「この金額は液晶・女神間・AT間の3テーブル
  へ足し算しない」と明記している別モデルの補助期待値のため、続行推奨/様子見/
  見送りの判定(rules)には一切使わず、結果画面に参考metricとして並記するのみ
  に留めている(l_sengoku_musume5.yamlのev_cycle_reference_yenと同じ扱い)。
  5.6枚系レートのデータは見つからなかったため、その場合はNoneのままになる。

  加えて、この機種には「通常A・通常B・通常C・通常D・天国」の5モードがあり、
  モードごとに規定ゲーム数(通常A/C/D=1101G+α、通常B=701G+α、天国=100G)と
  規定G数到達時の恩恵(通常A/B=機械仕掛けの女神、通常C=AT当選直撃、通常D=
  劇場ジャッジ)が異なることが出典ページの詳細アコーディオンで確認できた。
  本プロファイルのlcd_game_count基準の期待値(lcd_normal/lcd_reset)は、この
  5モードを平均化したブレンド値であり、出典ページ自身も「モード示唆を確認
  できた場合は表より有利に見てよい」と明記している。モード別の円換算EVテーブル
  ではなく移行率%の表(前回通常B以外/前回通常Bごとの移行先モード分布、液晶
  G数ゾーンごとのモード出現率)のため、新たな軸・ev_lookupsは追加せず、この
  notes欄への記載に留める(CLAUDE.mdの「機種追加時の調査ガイドライン」に基づく
  対応。モンキーターンVのライバルモードと異なり、この機種のモード差はEV表の
  非単調な変化を生むほどの周期切れ目構造ではないため、ev_policy_noteへの
  「非単調」注記は不要と判断した)。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

