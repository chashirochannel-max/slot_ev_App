# L戦国乙女5 業火を穿つ宿焔の双刃 機種プロファイル
#
# 【重要な訂正:この機種はパチンコではなく「スマスロ」(パチスロ)である】
# 本プロファイルの作成依頼では「L戦国乙女5はパチンコ機」という前提が示されていたが、
# 実際に検索・裏取りした結果、この機種は正式にパチスロ(スマートスロット/AT機)で
# あることが複数の独立した一次情報源で確認できた。数値を捏造しないという方針上、
# この前提の誤りを訂正した上で、実際の機種仕様に合わせてプロファイルを作成する。
#   - P-WORLD公式機種データベースの表記:
#     「L戦国乙女5 業火を穿つ宿焔の双刃(スマスロ)」(machine/database/10473)
#   - 各解析サイトの分類・メタタグ:
#     slot-toolbox.com記事のarticle:tagが「スマスロ」、本文中に「タイプ:スマスロ
#     AT機」と明記(https://slot-toolbox.com/sengoku-otome5-tenjo/)
#     chonborista.com/nana-press.com/pachiseven.jpも「スマスロ 戦国乙女5」として掲載
#   したがって、依頼文にあった「回転数/差玉/遊タイム」等のパチンコ用語軸は使わず、
#   既存のスマスロ機種(monkey_turn_v.yaml、world_dystar.yaml)と同じ「AT間ゲーム数
#   天井+周期」のアーキテクチャをそのまま適用した。エンジン側(rules.py/
#   profile_loader.py)の汎用機構(axes/tables/ev_lookups)は変更不要。
#
# 【天井システム】
# AT間実ゲーム数天井(通常999G+α/設定変更後650G+α)と、周期天井(最大6周期/
# 設定変更後は最大4周期)の2系統があり、どちらか先に到達した方でAT「強カワ
# RUSH」に当選する。周期が深いほどAT当選期待度が上がる仕組み(設定1で1・2周期目
# 約40%、3〜5周期目30%以上)だが、天井狙いの実戦上はAT間実ゲーム数を基準に
# 判断するのが一般的(出典サイト側も期待値算出はAT間実ゲーム数のみを基準にして
# おり、周期別の当選率は個別に反映していないと明記している)。
# 出典: https://slot-toolbox.com/sengoku-otome5-tenjo/ (2026年9月12日取得)
#       https://www.p-world.co.jp/machine/database/10473
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slot-toolbox.com「スマスロ 戦国乙女5 天井期待値・狙い目・
# やめどきまとめ」の本文表(通常時G数と設定変更後G数を並記した共通天井期待値表)を
# 転記したもの。WebFetchのAI要約は過去に存在しない表を作文したことがあったため、
# curlで生HTMLを取得しRead toolで<table>タグ内の実際の値を直接目視確認した上で
# 転記している(攻略サイト側の算出値であり、公式一次情報ではない)。
# サイト本文の表は「通常時G数」と「設定変更後G数」を同じ行(同じ期待値)に並べて
# おり、対応関係は「設定変更後0G = 通常349G」(以降50G刻みでずれも同じ349G)。
# 本プロファイルではこれをnormal(通常時G数キー)/short(設定変更後G数キー)の
# 2つの独立テーブルに分解して転記した(world_dystar.yamlと同じ手法)。転記した
# 数値は下記スクリプトでアサーション検証済み(対応関係の一致、レート列ごとの
# 単調増加、5.6枚現金が等価以下であること、サイト側が「時給2,000円ライン」と
# 明示した行のEVが+2,000円以上であることを確認):
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\build_otome5_table.py
# 前提条件(ページ内の記載による):
#   - 設定1ベース。通常時約31.0G/50枚、AT初当り1/359.5、AT終了後は即ヤメを
#     基準にした算出値
#   - 周期別のAT期待度・周期テーブル・周期モード・周期内ゲーム数は状態別には
#     計算に反映していない(サイト側が本文中で明記)。つまりこの期待値は
#     「現在何周期目か」を無視した、AT間実ゲーム数だけを基準にした平均的な
#     目安である
#   - 設定変更後の巫女ポイント初期値・乙女ストラップ・ゴエモン依頼ポイントも
#     個別加算していない
#
# 【2026年9月12日、光さんからの指摘を受けて再検証】
# 「リセット後は0Gから期待値プラスなのは本当か」という疑問を受け、curlで
# ページを再取得しshortテーブルの根拠部分を再確認した。サイト本文に以下の
# 説明が明記されている(原文):
#   「通常状態と設定変更後は、AT当選後の回収条件と天井恩恵が共通です。
#    設定変更後はゲーム数天井が999G＋αから650G＋αへ349G短縮されるため、
#    通常時G数と設定変更後G数を同じ期待値表で確認できます。」
#   「通常状態と設定変更後は同じ基礎AT当選条件・有効回収枚数を使い、
#    ゲーム数天井を999Gと650Gへ分けて計算しています。」
#   「通常349Gと設定変更後0Gは、ゲーム数天井までの残りが同じ650Gとなる
#    ため同じ期待値として扱っています。」
# つまり「0Gから勝てる」という意味ではなく、「AT当選確率・回収枚数は
# リセット前後で同じという前提のもと、天井までの残りゲーム数が同じなら
# 期待値も同じ」という计算方法。リセットで999G→650Gに天井が349G短縮される
# 恩恵を、0G時点の「先払い済みポジション」として計算上プラスに乗せている。
# 天井が大幅短縮される機種はリセット確定なら早い段階から期待値が出るという
# 考え方自体は天井狙いでは一般的で、本プロジェクトのmonkey_turn_v(reset)・
# world_dystar(short)も同じ構造。ただし現在周期・巫女ポイント初期値等
# (このサイトが個別計算していないと明記している要素)次第で実際の値は
# 上下し得る点は変わらない。
#
# 【データ確度に関する注記(重要)】
# 別の解析サイトslobase.jp(https://slobase.jp/articles/sengoku-otome5-expected-value)
# にも50G刻みの独自期待値表があり、同じくcurl+Read toolで生HTML(1行に圧縮された
# ミニファイ済みHTML)から数値を確認した。slobase.jp側は同じゲーム数でも本プロファ
# イルの採用元(slot-toolbox.com)より明確に低い(保守的な)期待値を算出している
# 傾向がある(例: 等価交換のプラス転換ポイントがslot-toolbox=300G台前半に対し
# slobase=400〜450G付近)。両サイトとも「単調増加」「大まかな損益分岐ゲーム数の
# 桁」は一致しており、どちらかが明らかな捏造・矛盾というわけではなく、本プロジェクト
# のworld_dystar.yamlで確認済みの「slot-toolbox.comはslobase.jpよりやや楽観的な
# 期待値を算出する傾向がある」という既知のパターンと整合する。実戦ログが貯まるまで
# は「本テーブルの期待値はやや楽観寄りの可能性がある」という前提で使うこと。
#
# 【周期・周期内ゲーム数を判定に使わない理由】
# 上記の通り、見つかった期待値データはAT間実ゲーム数のみを基準にしたものであり、
# 周期別のEVテーブルは(捏造を避けるため)未確認のまま採用していない。そのため
# current_cycle・cycle_game_countは判定(ev_lookups)には使わず、参考表示専用の
# 軸として残している(モンキーターンVのrival_mode軸と同じ扱い)。
#
# 【2026年9月13日追記:周期だけを狙う場合の「参考期待値」を追加】
# 光さんから「戦国乙女5には周期ごとの転換ゲーム数はないのか」と聞かれ、
# slot-toolbox.comを再取得したところ、本文に「周期だけを取りに行く参考期待値」
# という別テーブル(周期内Gを軸にした円換算表、1周期目・2周期目・3〜4周期目分)
# が存在することを確認した(前回2026年9月12日の調査時点では見落としていた)。
# ただしサイト側が明記する重要な制約がある(原文):
#   「基本のAT間実G期待値には周期経由の当選が平均的に含まれるため、
#    この金額を基本期待値表へ足し算しません。」
#   「周期参考期待値とAT間実G期待値は単純に足し算できませんが、判断材料に
#    なります。」
# つまりこの周期参考期待値は、メインのev_yen(AT間実ゲーム数基準)とは別モデル
# (周期内Gの進み方を実Gの1.5倍と仮定した粗い近似、AT期待度も1〜2周期目40%/
# 3〜4周期目30%という丸めた値を使用)であり、合算・比較すべきものではない。
# そのため tables.cycle_reference / ev_cycle_reference_yen として追加するが、
# rulesの続行推奨/様子見/見送り判定には一切使わず(ev_yenのみで判定する従来
# 通りの挙動を維持)、結果画面に「判定には使わない参考値」として並べて表示する
# だけに留める。5〜6周期目はサイト側も「0Gから良好」という定性的記載のみで
# 円換算の数値表が無いため、捏造を避けるためcycle=5,6の行は追加していない
# (3〜4周期目はサイト側が1つの表として2つの周期をまとめて算出しているため、
# cycle=3とcycle=4の両方に同一の行を割り当てている。これも転記であり、
# 各周期ごとに別々の値を捏造したわけではない)。
# 出典: https://slot-toolbox.com/sengoku-otome5-tenjo/ (2026年9月13日再取得)
# 検証スクリプト(単調増加・現金レートが等価以下であることを確認):
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\build_otome5_cycle_reference.py

id: l_sengoku_musume5
name: "スマスロ 戦国乙女5 業火を穿つ宿焔の双刃"
summary: "AT間実ゲーム数天井(通常999G+α/設定変更後650G+α)。周期天井(最大6周期/設定変更後4周期)もあるが期待値データは未確認のため参考表示のみ。"
ev_policy_note: >
  AT間実ゲーム数天井(通常999G+α/設定変更後650G+α)到達または自然当選まで
  打ち続け、AT終了後は追加で粘らずヤメることを前提にした期待値です(出典
  サイトの算出条件「AT終了後即ヤメ」)。周期・巫女ポイント等の示唆による
  上振れは金額に反映されていません。
  参考:「周期到達だけを狙う場合の期待値」を別途表示していますが、こちらは
  周期内Gの進み方を実Gの1.5倍と仮定した粗い近似モデルで、AT間実G基準の
  期待値とは前提が異なるため単純に合算できません(出典サイトも明記)。
  1〜4周期目のみのデータで、5〜6周期目は数値化されていません。
header_image: "assets/l_sengoku_musume5.jpg"  # 光さんが用意したメーカー公式画像。scripts/process_header_image.pyで800x400に加工済み

axes:
  - key: current_game_count
    label: "現在のAT間実ゲーム数(通常999G+α天井/設定変更後650G+α短縮天井、共通のカウンター表示)"
    type: integer
    default: 0
    # 期待値テーブルの参照キー。画面表示(メニュー)から直接観測する値。

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か"
    type: boolean
    default: true
    # 期待値テーブルのどちらの表(通常999G+α用/設定変更後650G+α短縮用)を
    # 参照するかを決める。

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。
    # 期待値テーブル(tables)のどのレート区分を参照するかを選ぶ。

  - key: current_cycle
    label: "現在の周期(リール左液晶表示、1〜6周期・設定変更後は最大4周期。ev_yenの判定には未反映、周期参考値の計算にのみ使用)"
    type: integer
    default: 1
    optional: true
    # メインの判定(ev_yen、AT間実ゲーム数基準)には使わない。入力すると、
    # 判定には使わない別枠の「周期参考期待値」(ev_cycle_reference_yen)を
    # 追加で計算・表示する(cycle_game_countと合わせて入力した場合のみ)。
    # 1〜4周期目のみデータがあり、5〜6周期目は出典に数値表が無いため計算されない。

  - key: cycle_game_count
    label: "現在の周期内ゲーム数(リール左液晶表示。強カワチャンスによる加算を含む。ev_yenの判定には未反映、周期参考値の計算にのみ使用)"
    type: integer
    default: 0
    optional: true
    # current_game_count(AT間実ゲーム数)とは別管理のカウンター。メインの判定
    # には使わない(周期参考期待値ev_cycle_reference_yenの計算にのみ使用)。

derived:
  # この機種にモンキーターンVのような「テーブル行としてのcycle」概念は、メインの
  # 期待値(ev_yen)データ上は存在しない(見つかった期待値表はAT間実ゲーム数のみを
  # 基準にしたもの)。tables.normal/shortの各行はcycle列を全行1で埋めており、
  # そこと一致させるための定数。これによりengineの2次元(cycle×game_count)
  # ルックアップ機構をそのまま1次元テーブルとして流用できる(world_dystar.yaml/
  # toaru_index2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

  # 周期参考期待値(cycle_reference)はtable_select_true/falseの区別がなく
  # 常に同じテーブル群を見るため、table_select_axisに常にtrueを返す定数を
  # 割り当てている(toaru_index2.yamlのalways_mainと同じ手法)。
  - key: always_main
    expr: "True"

# 期待値テーブル参照の設定。reset_likelyでnormal/shortのどちらの表を見るか、
# exchange_rateでどのレート区分を見るかを決め、dummy_cycle(常に1で完全一致)と
# current_game_count(前後の行を線形補間)で該当する期待値(円)を引く。結果は
# ev_yenという名前でderived/rulesから参照できるようになる。
ev_lookups:
  - table_select_axis: reset_likely
    table_select_true: short
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定1想定・AT間実ゲーム数基準)"
    table_true_label: "設定変更後"
    table_false_label: "通常時(据え置き)"

  # 続行推奨/様子見/見送りの判定(rules)には一切使わない参考値。current_cycle・
  # cycle_game_countを両方入力した場合のみ計算され、結果画面にev_yenとは別の
  # metricとして並記される。出典サイトが「基本期待値表へは足し算しない」と
  # 明記しているモデルのため、rules側では絶対に参照しないこと。
  - table_select_axis: always_main
    table_select_true: cycle_reference
    table_select_false: cycle_reference
    rate_axis: exchange_rate
    cycle_axis: current_cycle
    game_count_axis: cycle_game_count
    result_key: ev_cycle_reference_yen
    label: "参考:周期到達だけを狙う場合の期待値(AT間実Gの表とは合算不可)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # 攻略データの推定誤差を考慮した暫定値で、実戦ログが貯まったら調整すること。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定1想定・AT間実ゲーム数基準)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定1想定・AT間実ゲーム数基準)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定1想定・AT間実ゲーム数基準)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  依頼時の前提(パチンコ機)は誤りで、L戦国乙女5は正式にはスマスロ(パチスロAT機)
  である(P-WORLD公式機種データベース、slot-toolbox.com等の複数ソースで確認)。
  そのため回転数/差玉/遊タイムではなく、既存のスマスロ機種と同じAT間ゲーム数天井
  +周期のアーキテクチャを採用した。期待値はすべて設定1(最低設定)を仮定した攻略
  サイト(slot-toolbox.com、2026年9月12日取得)の算出値であり、実際の設定・実戦
  データによる補正ではない。同種の解析サイトslobase.jpはより保守的な(低めの)
  期待値を算出しており、本テーブルはやや楽観寄りの可能性がある(world_dystar.yaml
  で確認済みの両サイト間の傾向差と整合)。この機種には周期天井(最大6周期/設定変更後
  4周期、周期が深いほどAT当選期待度が上昇)という第2の天井系統があるが、周期別の
  期待値テーブルは出典サイト側でも個別算出されておらず(本文中で明記)、数値を
  捏造しないという方針上、current_cycle/cycle_game_countは参考表示専用の軸として
  残し、判定(ev_lookups)には使っていない。導入から日が浅く実戦データの蓄積も薄い
  ため、実戦ログが十分に貯まった段階で、光さん自身のデータと突き合わせて閾値や
  テーブル自体を補正すること。

