# L青春ブタ野郎はバニーガール先輩の夢を見ない(青ブタ) 機種プロファイル
#
# 【機種情報】
# オリンピア製、2026年9月7日導入のスマスロAT機。
# 青春BONUS初当り1/350.8(設定2)〜1/207.8(設定6)、出玉率98.1%〜110.3%、
# 通常時ベース約31.5G/50枚、純増約8.0枚/G。
# 設定1は下パネル消灯で判別される仕様のため、出典の設定別表は設定2〜6のみ。
#
# 【天井システム】
#   - ボーナス間天井: 899G+αで青春ボーナス当選。
#   - 設定変更後・ST駆け抜け後: 699G+αに短縮(200G短縮)。出典は実戦で
#     「ST駆け抜け後703Gの天井発動」を確認したと記載。
#   - CZ間天井: 560G+α、または思春期ポイント1000ptでCZ「エピソードチャンス」当選。
#   - CZスルー天井: 6回連続失敗後の7回目CZは成功濃厚。
#   - CZ(RB扱いのホールあり)ではデータカウンターがリセットされても実機のボーナス間
#     天井はリセットされない。
# 出典の期待値表は「短縮時0G＝通常時200Gとして同じ行で確認できます」と明記した上で、
# 通常時G数と短縮時G数を1つの表に並記する形式。本プロファイルではこの1本の表を
# normal/shortの2テーブルに分割して転記しただけで、独自の補間・推測は行っていない。
# 短縮条件が複数(設定変更・ST駆け抜け)あるため、world_dystar.yaml・paripi_koumei.yaml
# と同じくboolean軸名はshort_ceiling_activeとした。
#
# 【この期待値データについて(重要)】
# slot-toolbox.com「L青春ブタ野郎 天井期待値・狙い目・やめどき」の「💰 天井期待値・
# 狙い目ライン」の基本表を転記したもの。WebFetchのAI要約は使わず、
# curl -s -A "Mozilla/5.0" で取得した生HTML/タグ除去テキストを目視+Pythonで行単位に
# 抽出して転記。
#   C:\Users\sauza\AppData\Local\Temp\claude\C--Users-sauza-my-project\
#   b78863b9-ace0-43fd-9f6b-4beeeac05af8\scratchpad\pages\ao-buta.html / ao-buta.txt
# 出典: https://slot-toolbox.com/ao-buta-tenjo/ (2026年10月29日取得)
#
# 【期待値表の前提条件(出典ページ本文より要約)・設定2基準である点に注意】
#   - 本機の通常運用で最も低い設定2を基準(他機種プロファイルは設定1基準)。
#     青春BONUS初当り1/350.8・出玉率98.1%・通常時ベース約31.5G/50枚・純増約8.0枚/G。
#   - 通常899G+α、設定変更後・ST駆け抜け後699G+αとして計算。
#   - 5.6枚持ちは1000円/56枚、5.6枚現金は投資20円/枚・回収1000円/56枚。
#   - 思春期ポイント、CZ間560G、CZスルー回数、上位CZ失敗後などの追加価値は金額へ
#     直接加算していない。ボーナス・ST終了後は思春期ポイントと状態を確認し、続行条件が
#     なければ終了する前提。閉店取り切れずは考慮していない。
#
# 【プラス転換ゲーム数(転記した実データより)】
# 通常(899G): 等価 100G(-117円)→200G(+348円)/5.6枚持ち 100G(-104円)→200G(+311円)/
#             5.6枚現金 300G(-194円)→400G(+583円)
# 短縮(699G): 等価・持ちは0Gからプラス(+348円/+311円)、5.6枚現金 100G(-194円)→200G(+583円)
# 出典の「狙い目」(時給1,000円基準): 通常 等価240G/持ち250G/現金390G前後〜、
# 短縮 等価40G/持ち50G/現金190G前後〜。
#
# 【データ範囲・扱わなかったもの】
#   - 通常テーブルは0〜890G(800G以降は850G・890G)、短縮テーブルは0〜690G。それを
#     超える入力はengine仕様によりNone(様子見)。
#   - 出典には「CZスルー回数別・CZ間0G/200G/400G参考期待値」の3表もあるが、出典自身が
#     「CZルート単独の参考値」「基本天井期待値表とは単純に足し算せず」と注記しており、
#     CZ間G数は3点のみで補間の根拠も薄いため、判定用テーブルには入れずnotesに
#     代表値のみ記載した。
#   - 転記した全テーブルが単調増加であることを確認済み(非単調注記なし)。

id: aobuta
name: "L青春ブタ野郎はバニーガール先輩の夢を見ない"
summary: "ボーナス間899G+α天井。設定変更後・ST駆け抜け後は699G+αに短縮(通常時+200G相当)。CZ間560G・思春期ポイント1000pt・CZ6スルー天井は判定には未反映。期待値は設定2基準。"
ev_policy_note: >
  ボーナス・ST終了後は思春期ポイントと前兆を確認し、続行条件がなければ終了する
  前提の期待値です(出典の算出条件)。出典のやめどきは「60pt以上なら100pt到達後の
  前兆まで、60pt未満なら前兆・高確・不可思議モードがなければ基本ヤメ」。思春期
  ポイント(700pt以上は表より有利)、CZ間560G、CZスルー回数(5スルー以上は優先度
  アップ、6スルー後は次回CZまで続行)、上位CZ失敗後の価値は金額に反映されていま
  せん。なおこの機種の期待値は設定1ではなく設定2基準です(設定1は下パネル消灯で
  判別できるため)。ゲーム数はデータカウンターではなく液晶右上の実機表示を優先して
  ください。
header_image: "assets/badges_mascot/aobuta.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のボーナス間ゲーム数(液晶右上。CZ=RBでデータカウンターが区切られても実機のボーナス間は継続)"
    type: integer
    default: 0

  - key: short_ceiling_active
    label: "天井が699G+αに短縮されている状態か(設定変更後・ST駆け抜け後のいずれか)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚持ちメダル", "5.6枚現金"]
    default: "5.6枚現金"
    # 2026年9月、光さんの指示により、今後の期待値計算は最も保守的な5.6枚現金
    # 交換をデフォルトにする(等価はやや楽観的で、実戦の交換レートと合わないため)。

derived:
  # cycleの概念はない。tables側の各行はcycle列を全行1で埋めており、そこと一致
  # させるための定数(bakemonogatari.yaml・world_dystar.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

ev_lookups:
  - table_select_axis: short_ceiling_active
    table_select_true: short
    table_select_false: normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_yen
    label: "期待値(設定2想定・ボーナス間天井基準)"
    table_true_label: "短縮(設定変更後・ST駆け抜け後/699G天井)"
    table_false_label: "通常(899G天井)"

rules:
  - id: ev_missing
    condition: "ev_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外(通常890G超/短縮690G超)、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  - id: ev_go
    condition: "ev_yen != None and ev_yen > 200"
    result: "続行推奨"
    reason: "期待値(設定2想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_yen != None and ev_yen >= -200"
    result: "様子見"
    reason: "期待値(設定2想定)が収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "期待値(設定2想定)がマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  期待値は設定2(本機の通常運用で最も低い設定)を仮定した攻略サイト(slot-toolbox.com)
  の算出値であり、他機種プロファイルの設定1基準とは前提が異なる。実際の設定・実戦
  データによる補正ではない。shortテーブルは出典が「短縮時0G＝通常時200G」と明記して
  いる対応関係どおり、通常テーブルの200G〜890G行をそのまま0G〜690Gとして転記した
  もので、補間・推測による値ではない。

  参考(判定未使用): 出典の「CZスルー回数別・CZ間0G参考期待値」(CZルート単独の値、
  基本表とは足し算しない)は、等価で0スルー-672円/4スルー-87円/5スルー+908円/
  6スルー+3,562円、5.6枚現金で5スルー-232円/6スルー+2,422円。CZ間200G・400Gの
  参考表もあり、6スルー・CZ間400Gで等価+6,885円/5.6枚現金+5,745円。

  出典の「狙い目」ライン(時給1,000円基準)はEV=0地点より深いため、本プロファイルの
  rules(EV=0±200円)は出典の狙い目より早く「様子見」「続行推奨」に転じる。

  実戦ログが貯まったら、光さん自身のデータで各テーブル・しきい値を補正すること。

