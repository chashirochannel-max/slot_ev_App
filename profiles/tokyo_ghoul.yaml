# スマスロ L 東京喰種 機種プロファイル
#
# 【機種情報(確認済み)】
# メーカー:スパイキー。タイプ:AT機・スマスロ(6.5号機)。導入日:2025年2月3日。
# 「東京喰種」原作10周年記念作品としての初のパチスロ化(依頼文にあった「東京グール」
# はファン・攻略サイト側の通称表記で、P-WORLD公式機種データベース上の正式名称は
# 「L 東京喰種(スマスロ トーキョーグール TG)」)。本プロファイルのid/nameは公式表記
# に合わせた。「東京喰種」名義のパチスロ機はこれが唯一で、旧機種・別バージョンとの
# 混同(本プロジェクトで過去に発生したSAO2/SAO旧作のような取り違え)は無い。
# 出典:
#   - https://www.p-world.co.jp/machine/database/10207 (2026年9月13日取得。
#     メーカー・タイプ・導入日・天井仕様を確認)
#   - https://slot-toolbox.com/tokyo-ghoul-tenjo/ (2026年9月13日取得)
#   - https://slobase.jp/machines/tokyo-ghoul (2026年9月13日取得)
#   - https://chonborista.com/slot/spiky/226073/ (2026年9月13日取得。天井G数
#     600G/1200G/200Gの3サイト一致を確認するためのクロスチェック用)
#
# 【天井システム(P-WORLD公式機種データベースの「天井」欄より、2026年9月13日取得)】
# 独立した2系統のゲーム数天井を持つ(とある魔術の禁書目録2=toaru_index2.yamlと
# 同じアーキテクチャ)。
#   - CZ間天井(液晶右下のゲーム数表示):CZ・AT間を最大600G+α消化でCZ当選。
#     設定変更後のみ特殊モードに必ず移行し、天井G数が200G+αに短縮される。
#   - AT間天井(メニュー画面・データカウンターの実ゲーム数):AT間を最大1200G+α
#     消化でAT当選確定。この天井は設定変更の影響を受けず、常に1200G+α
#     (P-WORLD本文・slot-toolbox.com・slobase.jpのいずれにも短縮の記載なし)。
# 通常時のモード(通常A/B/C・チャンス・天国準備・天国)によりCZ間の規定G数は
# 300G+α〜600G+αの範囲で変動するが、期待値テーブル側はモードを区別しない
# 集計値のため、モード軸はaxesに追加していない(toaru_index2.yamlのlcd_czと
# 同じ扱い)。
#
# 【この期待値データについて(重要)】
# tables以下の数値は、slobase.jp「スマスロ 東京喰種トーキョーグール(グール)」の
# 期待値一覧セクション(3つの独立したテーブル:通常時AT間天井/通常時CZ間天井/
# 朝一0スルーCZ間短縮天井)をcurlで生HTML(Next.js RSCペイロード内の文字列)を
# 取得しRead toolで直接転記したもの。WebFetchのAI要約は使わず、テーブル行の
# 実際の数値文字列を目視確認している。
# AT間天井についてはslot-toolbox.com「スマスロ L 東京喰種天井期待値・狙い目・
# やめどきまとめ」にも100G刻みの独立集計テーブルがあり、両サイトの値を突き合わせた
# ところ、共通G数地点で全て±5円以内の差(丸め誤差程度)で一致することを検証スクリプト
# で確認済み(コピペではなく両サイトが独自に近似計算した結果と判断できる)。
# CZ間天井(通常600G+α/短縮200G+α)についてはslobase.jpにのみ数値テーブルが
# あり(slot-toolbox.comはCZ間の円換算テーブルを公表していない)、単独ソースの
# ため参考程度に留意すること。
# 検証スクリプト(単調増加・現金レートが等価以下であること・サイト本文が明記する
# 「プラス転換G数」との整合性・slot-toolbox.comとの相互検証を確認):
#   C:\Users\sauza\AppData\Local\Temp\claude\c--Users-sauza-my-project-slot-evassist-too\
#   a3ff291a-4e27-4fee-b704-c9ff8da96190\scratchpad\build_tokyoghoul_tables.py
# 出典:
#   - https://slobase.jp/machines/tokyo-ghoul (2026年9月13日取得)
#   - https://slobase.jp/articles/tokyo-ghoul-expected-value (2026年9月13日取得。
#     計算前提の記載を確認)
#   - https://slot-toolbox.com/tokyo-ghoul-tenjo/ (2026年9月13日取得。AT間天井の
#     クロスチェック用)
#
# 【計算前提条件(slobase.jp記事本文より、AT間/CZ間/短縮天井の3表すべてに共通)】
# 「本記事の数値は設定1・AT終了後即ヤメ・コイン持ち31G/50枚・純増4.0枚/G前提」
# (https://slobase.jp/articles/tokyo-ghoul-expected-value 本文より引用)。
# slot-toolbox.com側もAT間天井表について同様の前提(設定1・通常時ベース約31G/50枚・
# AT純増約4.0枚/G・AT終了後は即前兆を確認してヤメる想定)を明記しており、両サイトの
# 前提はほぼ一致している。
#
# 【交換レート軸を2段階(等価/5.6枚現金)にした理由】
# 他の機種プロファイル(world_dystar等)は「等価/5.6枚持ちメダル/5.6枚現金」の3段階
# だが、本機はCZ間天井の期待値テーブルを公表しているのがslobase.jpのみで、
# 同サイトは「等価」「56枚現金」の2列しか掲載していない(持ちメダル列がない)。
# AT間天井側はslot-toolbox.comに持ちメダル列があるが、CZ間側に対応データが
# 存在しない状態で3段階の軸を用意すると、「5.6枚持ちメダル」を選んだ時だけCZ間の
# 期待値が理由不明のまま計算不能(None)になり、光さんが「バグでは」と誤解する
# 事故につながる。数値を推測で埋めることも禁止されているため、本プロファイルでは
# 両方の期待値テーブルに揃って存在するレート区分(等価/5.6枚現金)のみを
# exchange_rateの選択肢とした。2026年9月の光さんの指示により、存在する区分の中で
# 最も保守的な「5.6枚現金」をデフォルトにしている。
#
# 【判定ロジックの考え方(toaru_index2.yamlと同じmax方式)】
# slobase.jpの記事本文が「CZ間天井600G+αとAT間天井1200G+αの2段階天井を持ち、
# どちらも独立した正規の狙い目」「CZ間は天井が浅く到達頻度が高い、AT間は深いぶん
# 期待値が大きいという住み分け」と明記しているため、2系統の期待値のうち高い方
# (max)を採用して判定する。toaru_index2.yamlと同じ設計。

id: tokyo_ghoul
name: "スマスロ L 東京喰種"
summary: "CZ間天井(通常600G+α/設定変更後200G+α、液晶ゲーム数)とAT間天井(1200G+α、実ゲーム数、リセット無関係)の2カウンター制。高い方の期待値で判定。"
ev_policy_note: >
  AT間実ゲーム数・CZ間液晶ゲーム数どちらも天井到達または自然当選まで打ち続け、
  AT終了後は追加で粘らずヤメることを前提にした期待値です(出典サイトの算出条件
  「設定1・AT終了後即ヤメ・コイン持ち31G/50枚・純増4.0枚/G」)。CZ間天井は
  設定変更後のみ200G+αに短縮されますが、AT間天井は設定変更の影響を受けず常に
  1200G+αです。モード示唆(通常A/B/C・チャンス・天国準備・天国)による上振れは
  金額に反映されていません。
header_image: "assets/badges_mascot/tokyo_ghoul.jpg"  # 自作マスコット「おもち」版(2026-10-29 光さん決定で全機種統一)

axes:
  - key: current_game_count
    label: "現在のAT間実ゲーム数(AT間天井1200G+α。メニュー画面またはデータカウンターで確認。設定変更の影響を受けない)"
    type: integer
    default: 0

  - key: current_cz_game_count
    label: "現在のCZ間液晶ゲーム数(CZ間天井、通常600G+α/設定変更後200G+α。液晶右下のゲーム数表示。実ゲーム数とはズレる場合がある)"
    type: integer
    default: 0

  - key: reset_likely
    label: "設定変更(0G状態)が濃厚か(CZ間天井のみ200G+αに短縮される。AT間天井には影響しない)"
    type: boolean
    default: false

  - key: exchange_rate
    label: "交換レート"
    type: enum
    options: ["等価", "5.6枚現金"]
    default: "5.6枚現金"
    # この機種はCZ間天井の期待値テーブルがslobase.jpのみの公表で、同サイトに
    # 5.6枚持ちメダル列が無いため、AT間・CZ間の両テーブルに揃って存在する
    # 等価/5.6枚現金の2区分のみを選択肢にしている(詳細はファイル冒頭コメント)。
    # 2026年9月、光さんの指示により、存在する区分の中で最も保守的な5.6枚現金を
    # デフォルトにする。

derived:
  # AT間天井には設定変更後の短縮テーブルが存在しない(単一グループ)ため、
  # ev_lookupsの仕組み上必須のtable_select_axis(boolean)に常にtrueを返す定数を
  # 割り当てて固定している(toaru_index2.yamlのalways_mainと同じ手法)。
  - key: always_main
    expr: "True"

  # この機種にモンキーターンVのような「テーブル行としてのcycle」概念は無い。
  # tables側の各行はcycle列を全行1で埋めており、そこと一致させるための定数。
  # これによりengineの2次元(cycle×game_count)ルックアップ機構をそのまま1次元
  # テーブルとして流用できる(world_dystar.yaml/toaru_index2.yamlと同じ手法)。
  - key: dummy_cycle
    expr: "1"

# 2系統の天井カウンター(AT間実ゲーム数/CZ間液晶ゲーム数)をそれぞれ独立に
# テーブル参照する。CZ間のみreset_likelyでnormal/shortのテーブルを切り替える。
ev_lookups:
  - table_select_axis: always_main
    table_select_true: at_ceiling
    table_select_false: at_ceiling
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_game_count
    result_key: ev_at_yen
    label: "期待値(設定1想定・AT間実ゲーム数基準・1200G+α天井)"

  - table_select_axis: reset_likely
    table_select_true: cz_short
    table_select_false: cz_normal
    rate_axis: exchange_rate
    cycle_axis: dummy_cycle
    game_count_axis: current_cz_game_count
    result_key: ev_cz_yen
    label: "期待値(設定1想定・CZ間液晶ゲーム数基準)"
    table_true_label: "設定変更後(CZ間200G+α短縮)"
    table_false_label: "通常時(CZ間600G+α)"

rules:
  - id: ev_missing
    condition: "ev_at_yen == None or ev_cz_yen == None"
    result: "様子見"
    reason: "入力されたゲーム数が期待値データの範囲外、または未入力です。入力内容を確認してください。"

  # ev_watch_band(±200円)は収支分岐点付近の「誤差」とみなすバッファ。
  # AT間実ゲーム数・CZ間液晶ゲーム数のうち高い方(max)を採用して判定する。
  - id: ev_go
    condition: "ev_at_yen != None and ev_cz_yen != None and max(ev_at_yen, ev_cz_yen) > 200"
    result: "続行推奨"
    reason: "AT間・CZ間のうち高い方の期待値(設定1想定)がプラス圏。攻略データ上は続行優位の目安です。"

  - id: ev_watch
    condition: "ev_at_yen != None and ev_cz_yen != None and max(ev_at_yen, ev_cz_yen) >= -200"
    result: "様子見"
    reason: "AT間・CZ間どちらの期待値(設定1想定)も収支分岐点付近。プラスマイナスどちらとも言えない目安です。"

default_result: "見送り"
default_reason: "AT間・CZ間どちらの期待値(設定1想定)もマイナス圏。攻略データ上は見送り優位の目安です。"

notes: >
  「東京グール」の通称で呼ばれることもあるが、P-WORLD公式機種データベース上の
  正式名称は「L 東京喰種(スマスロ トーキョーグール TG)」(スパイキー製、2025年
  2月3日導入、原作10周年記念作品としての初のパチスロ化)。同名義のパチスロは
  これが唯一で、旧機種との混同は無い。
  独立した2系統のゲーム数天井(CZ間600G+α/設定変更後200G+α、AT間1200G+α
  ・設定変更の影響なし)を持つ、とある魔術の禁書目録2(toaru_index2.yaml)と
  同型のアーキテクチャ。期待値はすべて設定1(最低設定)を仮定した攻略サイトの
  算出値であり、実際の設定・実戦データによる補正ではない。AT間天井はslobase.jp
  とslot-toolbox.comの2サイトの値が共通G数地点で誤差±5円以内で一致することを
  検証済みで信頼度が高い一方、CZ間天井(通常/短縮とも)の期待値テーブルは
  slobase.jpのみの公表で単独ソースのため、AT間側より参考程度に留意すること。
  交換レートは、CZ間側に5.6枚持ちメダルの公表データが無いため等価/5.6枚現金の
  2段階のみとしている(3段階が基本の他機種プロファイルとの差異、理由はファイル
  冒頭コメント参照)。実戦ログが十分に貯まった段階で、光さん自身のデータと
  突き合わせて閾値やテーブル自体を補正すること。

